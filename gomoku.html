<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1a0e">
<meta name="description" content="泥巴菜鸡战糖包 · 手机上玩的五子棋，糖包超算零败">
<title>泥巴菜鸡战糖包 · 五子棋</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#180f07;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;
    color:#f3e3cb}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;gap:6px;
    padding:calc(8px + env(safe-area-inset-top)) 10px calc(9px + env(safe-area-inset-bottom));
    background:
      radial-gradient(85% 55% at 50% -8%,rgba(146,104,60,.95) 0%,rgba(146,104,60,0) 62%),
      radial-gradient(120% 80% at 50% 112%,rgba(24,14,5,.95) 0%,rgba(24,14,5,0) 58%),
      linear-gradient(180deg,#5c3f26 0%,#33200f 55%,#1a1007 100%)}
  /* 背景泥点 */
  .splat{position:absolute;border-radius:50%;pointer-events:none;filter:blur(7px);opacity:.3}
  #hd{position:relative;text-align:center}
  #hd h1{margin:0;font-size:min(6.6vw,25px);letter-spacing:1px;color:#ffdfae;
    text-shadow:0 2px 0 #3a2210,0 0 14px rgba(255,186,88,.32)}
  #hd h1 .vs{color:#ffb347;font-size:.72em;margin:0 5px}
  #record{font-size:11.5px;color:#c9ab84;margin-top:3px;letter-spacing:.4px}
  #record b{color:#ffd07a}
  #cards{display:flex;gap:8px}
  .card{flex:1;display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:15px;min-width:0;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.22));
    border:1.5px solid rgba(255,214,160,.13);transition:border-color .25s,box-shadow .25s,background .25s}
  .card.on{border-color:#ffc65c;background:linear-gradient(180deg,rgba(255,198,92,.16),rgba(0,0,0,.24));
    box-shadow:0 0 0 1px rgba(255,198,92,.3),0 0 18px rgba(255,170,60,.25)}
  .card .ava{width:38px;height:38px;flex:0 0 38px}
  .card .ava svg{width:100%;height:100%;display:block}
  .card .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
  .card .meta b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tag{font-size:9.5px;padding:1px 6px;border-radius:8px;align-self:flex-start;
    background:rgba(0,0,0,.32);color:#f0d9b5;letter-spacing:.5px}
  .card .tag.ai{background:rgba(255,190,80,.22);color:#ffd88f}
  #bubble{display:flex;gap:6px;padding:7px 10px;border-radius:12px;min-height:36px;align-items:center;
    background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.06);font-size:12.5px;line-height:1.35;color:#eeddc2}
  #bubble b{flex:none;color:#ffcf7a}
  #bubble.sugar b{color:#ffe3a8}
  #bubble.mud b{color:#e8b884}
  #boardWrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
  #board{touch-action:none;display:block;border-radius:16px;
    box-shadow:0 12px 28px rgba(0,0,0,.55),0 0 0 3px rgba(255,214,160,.16)}
  #think{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);display:flex;gap:6px;
    align-items:center;padding:5px 13px;border-radius:999px;font-size:11.5px;color:#ffd493;
    background:rgba(20,12,5,.85);border:1px solid rgba(255,205,120,.32);white-space:nowrap}
  #think.hide{display:none}
  #think i{width:10px;height:10px;border-radius:50%;border:2px solid #ffcf7a;border-top-color:transparent;
    animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #ctrl{display:flex;gap:8px}
  #ctrl button{flex:1;padding:11px 4px;border-radius:14px;font-size:13.5px;font-weight:700;font-family:inherit;
    color:#ffeacb;background:linear-gradient(180deg,#7c5230,#472c16);
    border:1.5px solid rgba(255,206,140,.32);box-shadow:0 3px 0 #24160a,0 6px 14px rgba(0,0,0,.3)}
  #ctrl button:active{transform:translateY(2px);box-shadow:0 1px 0 #24160a}
  #ctrl button:disabled{opacity:.42;filter:grayscale(.6)}
  #ctrl button em{font-style:normal;color:#ffd166}
  #ctrl #btnSound{flex:0 0 46px;font-size:16px}
  #ovl{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;
    background:radial-gradient(65% 55% at 50% 42%,rgba(74,48,22,.9),rgba(10,6,2,.95))}
  #ovl.hide{display:none}
  #panel{width:min(92vw,392px);max-height:88vh;overflow:auto;text-align:center;border-radius:20px;padding:18px 18px 20px;
    background:linear-gradient(180deg,#4d3219,#28180b);border:2px solid rgba(255,199,120,.38);
    box-shadow:0 22px 50px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.35)}
  #panel h2{margin:0 0 4px;font-size:21px;color:#ffd79a;letter-spacing:1px;text-shadow:0 2px 0 #2a1708}
  #panel .sub{font-size:12px;color:#c8ab86;letter-spacing:.5px}
  #panel p{font-size:12.5px;line-height:1.75;color:#d8c2a2;margin:9px 0}
  #panel .big{font-size:14.5px;color:#fff0d5;font-weight:700}
  #panel .hi{color:#ffcf7a;font-weight:700}
  .row{display:flex;flex-direction:column;gap:9px;margin-top:13px}
  .row button{padding:13px;border-radius:14px;font-size:14.5px;font-weight:800;font-family:inherit;letter-spacing:.5px;
    color:#3a2208;background:linear-gradient(180deg,#ffd79a,#efb057);border:none;box-shadow:0 3px 0 #a9702c}
  .row button.ghost{background:linear-gradient(180deg,#6b4526,#3a2513);color:#ffe6c4;
    border:1.5px solid rgba(255,205,140,.28);box-shadow:0 3px 0 #21140a}
  .row button:active{transform:translateY(2px)}
  .tip{font-size:11px;color:#a98f70;margin-top:10px;line-height:1.6}
  @media (orientation:landscape) and (max-height:620px){
    #app{display:grid;grid-template-columns:min(46vw,330px) 1fr;grid-template-rows:auto auto auto 1fr;
      grid-template-areas:"hd board" "cards board" "bubble board" "ctrl board";gap:6px 10px}
    #hd{grid-area:hd}#cards{grid-area:cards}#bubble{grid-area:bubble}#boardWrap{grid-area:board}#ctrl{grid-area:ctrl}
    #hd h1{font-size:min(4.4vw,22px)}
  }
</style>

<body>
<div id="app">

<script id="engine">
/* ==========================================================================
   五子棋引擎 —— 泥巴菜鸡战糖包
   纯逻辑，零 DOM 依赖（可单独放进 node 里自测 / 对练）

   思路：
   1) 局面评估：对每个空点，用 9 格窗口的棋型表（3^8 = 6561 项）算出
      "这一手下在这里能形成什么棋型"（成五 / 活四 / 冲四 / 活三 / 眠三 / 活二…），
      四个方向累加。整盘分值 = 所有空点分值之和；落子、撤子只增量更新受影响的点。
   2) 搜索：迭代加深 α-β + 置换表 + killer + 着法排序。
      关键增强是"强制着法"：对手有成五点时必须只搜挡点；自己有成五点直接判胜。
      强制着法会把分支压到 1~2，于是连续冲四（VCF）那类深算几乎不花代价。
   3) 开局：空盘走天元；后手第一手贴对角。其余全靠搜索。
   ========================================================================== */
(function (global) {
  'use strict';

  var N = 15, SZ = N * N;
  var EMPTY = 0, BLACK = 1, WHITE = 2;
  var INF = 1e9, WINSCORE = 5e8;

  /* ---------- 棋型分值 ---------- */
  var S = {
    FIVE: 10000000,   // 成五
    OPEN_FOUR: 300000, // 活四（两头都能成五，基本等于赢）
    FOUR: 50000,      // 冲四（对手必须挡）
    OPEN_THREE: 20000, // 活三（对手必须应）
    THREE: 2000,      // 眠三
    OPEN_TWO: 500,    // 活二
    TWO: 100,
    ONE: 20
  };

  /* ---------- 方向：横 / 竖 / 撇 / 捺 ---------- */
  var DR = [0, 1, 1, 1], DC = [1, 0, 1, -1];

  /* ---------- 棋型模板（窗口内中心的 1 是刚下的那手） ---------- */
  var P_OPEN4 = ['011110'];
  var P_FOUR = ['11110', '01111', '11011', '10111', '11101'];
  var P_OPEN3 = ['001110', '011100', '010110', '011010'];
  var P_THREE = ['01110', '11100', '00111', '11010', '10110', '01101', '10101', '11001', '10011', '01011'];
  var P_OPEN2 = ['001100', '011000', '000110', '010100', '001010', '101000', '000101'];
  var P_TWO = ['0110', '1100', '0011', '1010', '0101', '1001'];

  function shapeScore(s) {
    var i;
    for (i = 0; i <= 4; i++) {
      if (s.charCodeAt(i) === 49 && s.charCodeAt(i + 1) === 49 && s.charCodeAt(i + 2) === 49 &&
          s.charCodeAt(i + 3) === 49 && s.charCodeAt(i + 4) === 49) return S.FIVE;
    }
    function hit(len, pats) {
      var lo = Math.max(0, 4 - len + 1), hi = Math.min(4, 9 - len);
      for (var k = lo; k <= hi; k++) if (pats.indexOf(s.substr(k, len)) >= 0) return true;
      return false;
    }
    if (hit(6, P_OPEN4)) return S.OPEN_FOUR;
    if (hit(5, P_FOUR)) return S.FOUR;
    if (hit(6, P_OPEN3)) return S.OPEN_THREE;
    if (hit(5, P_THREE)) return S.THREE;
    if (hit(6, P_OPEN2)) return S.OPEN_TWO;
    if (hit(4, P_TWO)) return S.TWO;
    return S.ONE;
  }

  /* 方向窗口查表：三进制编码 8 个邻格（0 空 / 1 己方 / 2 对方或墙） */
  var DIRTABLE = new Int32Array(6561);
  (function buildTable() {
    var d = new Array(8);
    for (var code = 0; code < 6561; code++) {
      var c = code;
      for (var i = 7; i >= 0; i--) { d[i] = c % 3; c = (c - d[i]) / 3; }
      DIRTABLE[code] = shapeScore('' + d[0] + d[1] + d[2] + d[3] + '1' + d[4] + d[5] + d[6] + d[7]);
    }
  })();

  /* ---------- 局面数据 ---------- */
  var board = new Int8Array(SZ);
  var dirSc = new Int32Array(SZ * 8);   // [(cell*4+d)*2 + (p-1)]
  var pSc = new Int32Array(SZ * 2);     // [cell*2 + (p-1)]
  var total = new Float64Array(3);      // total[p] = 全盘 p 的潜在分值之和
  var nc = new Int16Array(SZ);          // 附近 2 格内的落子数
  var inCand = new Uint8Array(SZ);
  var listPos = new Int16Array(SZ);
  var candList = [];
  var zob = new Int32Array(SZ * 2);
  var hash = 0, stones = 0;

  (function initZob() {
    var s = 20250923 | 0;
    function rnd() { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return s | 0; }
    for (var i = 0; i < SZ * 2; i++) zob[i] = rnd();
  })();

  var TIME_TIMEOUT = { timeout: true };

  function inB(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }

  /* ---------- 候选点管理 ---------- */
  function addCand(cell) {
    if (board[cell] === EMPTY && !inCand[cell]) {
      inCand[cell] = 1; listPos[cell] = candList.length; candList.push(cell);
    }
  }
  function delCand(cell) {
    if (inCand[cell]) {
      inCand[cell] = 0;
      var p = listPos[cell], last = candList.pop();
      if (p < candList.length) { candList[p] = last; listPos[last] = p; }
    }
  }
  function neighborBump(idx, delta) {
    var r0 = (idx / N) | 0, c0 = idx % N;
    var r1 = Math.max(0, r0 - 2), r2 = Math.min(N - 1, r0 + 2);
    var c1 = Math.max(0, c0 - 2), c2 = Math.min(N - 1, c0 + 2);
    for (var r = r1; r <= r2; r++) {
      for (var c = c1; c <= c2; c++) {
        if (r === r0 && c === c0) continue;
        var cell = r * N + c;
        nc[cell] += delta;
        if (delta > 0) { if (nc[cell] === 1) addCand(cell); }
        else if (nc[cell] <= 0) { nc[cell] = 0; delCand(cell); }
      }
    }
  }

  /* ---------- 分值增量维护 ---------- */
  function computeDirScore(cell, d, p) {
    var r0 = (cell / N) | 0, c0 = cell % N, dr = DR[d], dc = DC[d];
    var code = 0, r, c, b, v, step;
    for (step = -4; step <= 4; step++) {
      if (step === 0) continue;
      r = r0 + step * dr; c = c0 + step * dc; v = 2;
      if (r >= 0 && r < N && c >= 0 && c < N) {
        b = board[r * N + c];
        if (b === EMPTY) v = 0; else if (b === p) v = 1; else v = 2;
      }
      code = code * 3 + v;
    }
    return DIRTABLE[code];
  }

  function updateScores(idx) {
    var r0 = (idx / N) | 0, c0 = idx % N, d, step, p, r, c, cell, b, nv, old, delta;
    for (d = 0; d < 4; d++) {
      var dr = DR[d], dc = DC[d];
      for (step = -4; step <= 4; step++) {
        r = r0 + step * dr; c = c0 + step * dc;
        if (r < 0 || r >= N || c < 0 || c >= N) continue;
        cell = r * N + c;
        if (board[cell] !== EMPTY) continue;
        b = cell * 8 + d * 2;
        for (p = 1; p <= 2; p++) {
          nv = computeDirScore(cell, d, p);
          old = dirSc[b + p - 1];
          if (nv !== old) {
            dirSc[b + p - 1] = nv;
            delta = nv - old;
            pSc[cell * 2 + p - 1] += delta;
            total[p] += delta;
          }
        }
      }
    }
  }

  /* ---------- 落子 / 撤子（搜索内部用） ---------- */
  function put(idx, p) {
    board[idx] = p; stones++; hash ^= zob[idx * 2 + p - 1];
    delCand(idx);
    neighborBump(idx, 1);
    var b = idx * 8;
    total[1] -= pSc[idx * 2]; pSc[idx * 2] = 0;
    total[2] -= pSc[idx * 2 + 1]; pSc[idx * 2 + 1] = 0;
    for (var k = 0; k < 8; k++) dirSc[b + k] = 0;
    updateScores(idx);
  }
  function cut(idx) {
    var p = board[idx];
    board[idx] = EMPTY; stones--; hash ^= zob[idx * 2 + p - 1];
    neighborBump(idx, -1);
    if (nc[idx] > 0) addCand(idx);
    updateScores(idx);
  }

  function rebuildAll() {
    var i, d, p, cell, v, b;
    dirSc.fill(0); pSc.fill(0); nc.fill(0); inCand.fill(0);
    candList.length = 0; hash = 0; stones = 0;
    total[1] = 0; total[2] = 0;
    for (i = 0; i < SZ; i++) {
      if (board[i] !== EMPTY) { stones++; hash ^= zob[i * 2 + board[i] - 1]; }
    }
    for (i = 0; i < SZ; i++) if (board[i] !== EMPTY) neighborBump(i, 1);
    for (cell = 0; cell < SZ; cell++) {
      if (board[cell] !== EMPTY) continue;
      for (d = 0; d < 4; d++) {
        b = cell * 8 + d * 2;
        for (p = 1; p <= 2; p++) {
          v = computeDirScore(cell, d, p);
          dirSc[b + p - 1] = v;
          pSc[cell * 2 + p - 1] += v;
          total[p] += v;
        }
      }
    }
  }

  /* ---------- 着法生成（带排序 / 强制着法） ---------- */
  var MV = 30;
  var bufCell = [], bufSc = [], bufCnt = [], bufForced = [];
  var bufFour = [], bufFourS1 = [], bufFourCnt = [];
  var scratchCell = [], scratchS1 = [], scratchS2 = [];
  var killers = [];
  (function initBufs() {
    for (var i = 0; i < 48; i++) {
      bufCell.push(new Int32Array(MV));
      bufSc.push(new Float64Array(MV));
      bufCnt.push(0);
      bufForced.push(false);
      bufFour.push(new Int32Array(6));
      bufFourS1.push(new Float64Array(6));
      bufFourCnt.push(0);
      scratchCell.push(new Int32Array(256));
      scratchS1.push(new Float64Array(256));
      scratchS2.push(new Float64Array(256));
      killers.push([-1, -1]);
    }
  })();

  /* 返回 >=0 表示"这一手直接成五"；否则着法写入 bufXxx[ply]，数量在 bufCnt[ply] */
  function genMoves(ply, me, limit, ttBest) {
    var opp = 3 - me;
    var sCell = scratchCell[ply], sS1 = scratchS1[ply], sS2 = scratchS2[ply];
    var bCell = bufCell[ply], bSc = bufSc[ply];
    var fCell = bufFour[ply], fS1 = bufFourS1[ply];
    var k1 = killers[ply][0], k2 = killers[ply][1];
    var n = 0, nb = 0, nf = 0, i, cell, s1, s2, j3;

    for (i = 0; i < candList.length; i++) {
      cell = candList[i];
      s1 = pSc[cell * 2 + me - 1];
      s2 = pSc[cell * 2 + opp - 1];
      if (s1 >= S.FIVE) return cell;                       // 自己能成五
      sCell[n] = cell; sS1[n] = s1; sS2[n] = s2; n++;
      if (s2 >= S.FIVE) { bCell[nb] = cell; bSc[nb] = s1 + s2; nb++; }
      else if (s1 >= S.FOUR) {                             // 能冲四的点：静搜里用来做连续冲四（VCF）
        j3 = (nf < 6) ? nf : 5;

    for (i = 0; i < N; i++) {
      var p = pad + i * cell;
      c.beginPath(); c.moveTo(pad, p); c.lineTo(pad + (N - 1) * cell, p); c.stroke();
      c.beginPath(); c.moveTo(p, pad); c.lineTo(p, pad + (N - 1) * cell); c.stroke();
    }
    c.lineWidth = Math.max(1.4, cell * .085); c.strokeStyle = 'rgba(72,42,16,.85)';
    c.strokeRect(pad, pad, (N - 1) * cell, (N - 1) * cell);
    c.fillStyle = 'rgba(72,42,16,.8)';
    [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]].forEach(function (p2) {
      c.beginPath(); c.arc(pad + p2[1] * cell, pad + p2[0] * cell, Math.max(1.7, cell * .085), 0, 6.2832); c.fill();
    });
  }
  function layout() {
    var wrap = $('boardWrap');
    var w = wrap.clientWidth, h = wrap.clientHeight;
    if (w < 40 || h < 40) return;
    var s = Math.max(190, Math.floor(Math.min(w, h)) - 2);
    CSSSZ = s; CELL = s / (N + 1); PAD = CELL;
    DPR = Math.min(3, window.devicePixelRatio || 1);
    cv.style.width = s + 'px'; cv.style.height = s + 'px';
    cv.width = Math.ceil(s * DPR); cv.height = Math.ceil(s * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildBg();
    sprMud = makeSprite(drawMudSprite); sprSugar = makeSprite(drawSugarSprite);
    render();
  }

  /* ---------- 绘制 ---------- */
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function draw() {
    if (!CSSSZ || !bg) return;
    ctx.clearRect(0, 0, CSSSZ, CSSSZ);
    ctx.drawImage(bg, 0, 0, CSSSZ, CSSSZ);
    var now = performance.now(), bd = G.board(), i, p, pt;
    if (lastMove >= 0 && bd[lastMove]) {          // 最后一手标记
      pt = pos(lastMove);
      ctx.beginPath(); ctx.arc(pt.x, pt.y, CELL * .49, 0, 6.2832);
      ctx.strokeStyle = bd[lastMove] === aiP ? 'rgba(255,196,92,.9)' : 'rgba(255,120,80,.9)';
      ctx.lineWidth = Math.max(1.4, CELL * .075); ctx.stroke();
    }
    for (i = 0; i < SZ; i++) {                    // 棋子
      p = bd[i]; if (!p) continue;
      pt = pos(i);
      var sc = 1, t = popAt[i];
      if (t !== undefined) {
        var k = (now - t) / 170;
        if (k < 1) sc = .5 + .5 * easeOut(k); else delete popAt[i];
      }
      var spr = p === aiP ? sprSugar : sprMud;
      var size = SPR * sc;
      ctx.drawImage(spr, pt.x - size / 2, pt.y - size / 2, size, size);
    }
    if (winCells) {
      var k2 = Math.min(1, (now - winAt) / 500), pulse = .55 + .45 * Math.sin(now / 220);
      var a = winCells[0], b = winCells[winCells.length - 1], pa = pos(a), pb = pos(b);
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,214,110,' + (.35 + .3 * pulse) + ')';
      ctx.lineWidth = CELL * (.22 + .07 * pulse); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,246,200,' + (.5 + .4 * pulse) + ')';
      ctx.lineWidth = CELL * .1; ctx.stroke();
      winCells.forEach(function (c2, j) {
        var pc = pos(c2), sc2 = 1 + .18 * pulse;
        ctx.globalAlpha = .5 * k2;
        var spr2 = ctx.createRadialGradient(pc.x, pc.y, 0, pc.x, pc.y, CELL * .7 * sc2);
        spr2.addColorStop(0, 'rgba(255,235,150,.85)'); spr2.addColorStop(1, 'rgba(255,200,80,0)');
        ctx.fillStyle = spr2;
        ctx.beginPath(); ctx.arc(pc.x, pc.y, CELL * .7 * sc2, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = 1;
      });
      ctx.lineCap = 'butt';
    }
    if (hoverCell >= 0 && !over && !thinking && !bd[hoverCell] && turnP() === humanP) {
      var ph = pos(hoverCell);
      ctx.globalAlpha = .35;
      ctx.drawImage(sprMud, ph.x - SPR / 2, ph.y - SPR / 2, SPR, SPR);
      ctx.globalAlpha = 1;
    }
    for (i = 0; i < particles.length; i++) {       // 泥点 / 糖粒
      var q = particles[i];
      ctx.globalAlpha = Math.max(0, q.life) * .85;
      ctx.fillStyle = q.c;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function stepParticles() {
    var alive = [];
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      q.x += q.vx / 60; q.y += q.vy / 60; q.vy += 300 / 60; q.life -= 1 / 38;
      if (q.life > 0) alive.push(q);
    }
    particles = alive;
  }
  function spawn(cell, kind) {
    var pt = pos(cell);
    for (var i = 0; i < 13; i++) {
      var a = Math.random() * 6.2832, sp = 25 + Math.random() * 95;
      particles.push({
        x: pt.x + (Math.random() - .5) * CELL * .3, y: pt.y + (Math.random() - .5) * CELL * .3,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 45, r: 1.3 + Math.random() * 2.6, life: 1,
        c: kind === 'mud' ? 'rgb(124,81,42)' : 'rgb(255,238,206)'
      });
    }
  }
  function loop() {
    requestAnimationFrame(loop);
    var busy = particles.length > 0 || Object.keys(popAt).length > 0 || thinking ||
      (winCells && performance.now() - winAt < 1800);
    if (busy) { stepParticles(); draw(); dirty = false; }
    else if (dirty) { dirty = false; draw(); }
  }
  /* 状态一变就同步重绘一次：不依赖动画帧（切后台时 rAF 会被浏览器暂停） */
  function render() { dirty = false; draw(); }

  /* ---------- 交互 ---------- */
  function hit(ev) {
    var rect = cv.getBoundingClientRect();
    var x = (ev.clientX - rect.left) * (CSSSZ / rect.width);
    var y = (ev.clientY - rect.top) * (CSSSZ / rect.height);
    var c = Math.round((x - PAD) / CELL), r = Math.round((y - PAD) / CELL);
    if (r < 0 || r >= N || c < 0 || c >= N) return -1;
    if (Math.hypot(x - (PAD + c * CELL), y - (PAD + r * CELL)) > CELL * .62) return -1;
    return r * N + c;
  }
  cv.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    if (over || thinking || turnP() !== humanP) return;
    var cell = hit(ev);
    if (cell < 0 || G.board()[cell] !== 0) return;
    humanMove(cell);
  }, { passive: false });
  cv.addEventListener('pointermove', function (ev) {
    if (ev.pointerType === 'touch') return;
    var cell = hit(ev);
    if (cell !== hoverCell) { hoverCell = cell; dirty = true; }
  });
  cv.addEventListener('pointerleave', function () { hoverCell = -1; dirty = true; });

  /* ---------- 对局流程 ---------- */
  function turnP() { return hist.length % 2 === 0 ? 1 : 2; }
  function newGame(aiFirst) {
    G.newGame();
    hist = []; snaps = [G.snapshot()];
    undoLeft = 2; over = false; thinking = false; lastMove = -1; winCells = null;
    popAt = {}; particles = []; hoverCell = -1;
    humanP = aiFirst ? 2 : 1; aiP = 3 - humanP;
    $('ovl').classList.add('hide');
    $('think').classList.add('hide');
    showRecord(); updateCtrl();
    markTurn();
    turn();
    say(aiFirst ? 'sugar' : 'mud', aiFirst ? pick(SUGAR_LINES, 's') : pick(MUD_LINES, 'm'));
    render();
  }
  function markTurn() {
    var p = turnP();
    $('cardMud').classList.toggle('on', !over && p === humanP);
    $('cardSugar').classList.toggle('on', !over && p === aiP);
  }
  function updateCtrl() {
    $('undoLeft').textContent = undoLeft;
    $('btnUndo').disabled = over || thinking || undoLeft <= 0;
    $('btnNew').disabled = false;
    $('btnSwap').disabled = thinking;
  }
  function turn() {
    markTurn();
    if (over) return;
    if (turnP() === aiP) aiPlay();
    else { $('bubbleTxt').textContent = '该你了，落子吧。'; $('bubble').className = 'mud'; }
  }
  function commit(cell, p) {
    if (!G.play(cell, p)) return false;
    hist.push({ i: cell, p: p });
    snaps.push(G.snapshot());
    lastMove = cell; popAt[cell] = performance.now();
    spawn(cell, p === aiP ? 'sugar' : 'mud');
    return true;
  }
  function humanMove(cell) {
    if (!commit(cell, humanP)) return;
    sfx.place();
    var line = G.winLine(cell, humanP);
    if (line) { endGame(humanP, line); return; }
    if (hist.length >= SZ) { endGame(0, null); return; }
    say('mud', pick(MUD_LINES, 'm'));
    updateCtrl();
    turn();
  }
  function aiPlay() {
    thinking = true; updateCtrl(); markTurn();
    $('think').classList.remove('hide');
    $('thinkTxt').textContent = '糖包在算…';
    setTimeout(function () {
      var r;
      try { r = G.think(aiP, AI_TIME); }
      catch (e) {
        // 极端情况下退化为"第一个候选点"
        var cand = G.candidates();
        r = { move: cand.length ? cand[0] : 112, depth: 0, nodes: 0, ms: 0, score: 0 };
      }
      thinking = false;
      $('think').classList.add('hide');
      var mv = r.move;
      if (mv < 0) mv = 112;
      if (!G.board()[mv]) commit(mv, aiP);
      sfx.sugar();
      updateCtrl();
      var line = G.winLine(mv, aiP);
      if (line) { endGame(aiP, line); return; }
      if (hist.length >= SZ) { endGame(0, null); return; }
      say('sugar', r.win ? pick(SUGAR_KILL, 'k') : pick(SUGAR_LINES, 's'));
      render();
      turn();
    }, 60);
  }
  function undo() {
    if (over || thinking || undoLeft <= 0) return;
    var k = hist.length, removedHuman = false;
    while (k > 0 && hist[k - 1].p === aiP) k--;
    if (k > 0 && hist[k - 1].p === humanP) { k--; removedHuman = true; }
    if (!removedHuman) return;
    hist = hist.slice(0, k);
    snaps = snaps.slice(0, k + 1);
    G.restore(snaps[k]);
    undoLeft--;
    over = false; winCells = null;
    lastMove = k > 0 ? hist[k - 1].i : -1;
    popAt = {}; particles = []; hoverCell = -1;
    sfx.undo();
    updateCtrl();
    turn();
    say('mud', '这手不算，我重下！');
    render();
  }
  function endGame(winner, line) {
    over = true; thinking = false; winCells = line; winAt = performance.now();
    $('think').classList.add('hide');
    var dur = 0, x = (performance.now() - hist.length * 0);
    if (winner === aiP) { record.sugar++; sfx.lose(); }
    else if (winner === humanP) { record.chick++; sfx.win(); }
    else { record.draw++; sfx.undo(); }
    saveRecord(); showRecord(); updateCtrl(); markTurn();
    render();
    setTimeout(function () { showResult(winner); }, line ? 1500 : 400);
  }
  function showResult(winner) {
    var h = '';
    if (winner === aiP) {
      h = '<h2>糖包赢了 🍬</h2><div class="sub">' + pick(SUGAR_WIN, 'w') + '</div>' +
        '<p>本局 <span class="hi">' + hist.length + '</span> 手。糖包总战绩：<span class="hi">' +
        record.sugar + '</span> 胜。</p>';
    } else if (winner === humanP) {
      h = '<h2>不可能…你赢了？！</h2><div class="sub">糖包：一定是手机卡了。</div>' +
        '<p>恭喜！本局 <span class="hi">' + hist.length + '</span> 手。这个战绩会被记下来。</p>';
    } else {
      h = '<h2>平局</h2><div class="sub">泥巴和糖糊成一团了。</div><p>再打一局分个高低。</p>';
    }
    h += '<div class="row">' +
      '<button id="againAi">再来一局（糖包先走）</button>' +
      '<button id="againMe" class="ghost">再来一局（我先走）</button>' +
      '<button id="againSame" class="ghost">看这盘棋（慢着）</button></div>' +
      '<div class="tip">提示：你有 2 次悔棋机会，只能悔自己的棋。</div>';
    $('panel').innerHTML = h;
    $('ovl').classList.remove('hide');
    $('againAi').onclick = function () { newGame(true); };
    $('againMe').onclick = function () { newGame(false); };
    $('againSame').onclick = function () { $('ovl').classList.add('hide'); };
  }
  function showStart() {
    var h = '<h2>泥巴菜鸡 ⚔ 糖包</h2>' +
      '<div class="sub">15×15 五子连珠 · 手机直接玩</div>' +
      '<p>糖包是泥巴味超算：<span class="hi">六层以上算路 + 连续冲四杀棋</span>，' +
      '建成双活三、四三杀就一口吃掉你。放水？不存在的。</p>' +
      '<p class="big">选谁先走：</p>' +
      '<div class="row">' +
      '<button id="stAi">糖包先走（推荐 · 你更没机会）</button>' +
      '<button id="stMe" class="ghost">我先走（菜鸡也要面子）</button>' +
      '</div>' +
      '<div class="tip">你有 2 次悔棋机会，只能悔自己的棋。<br>想赢糖包？目前全网还没有人做到。</div>';
    $('panel').innerHTML = h;
    $('ovl').classList.remove('hide');
    $('stAi').onclick = function () { newGame(true); };
    $('stMe').onclick = function () { newGame(false); };
  }

  /* ---------- 绑定 ---------- */
  $('btnUndo').onclick = undo;
  $('btnNew').onclick = function () { if (!thinking) newGame(aiP === 1); };
  $('btnSwap').onclick = function () { if (!thinking) newGame(aiP !== 1); };
  $('btnSound').onclick = function () {
    sndOn = !sndOn;
    $('btnSound').textContent = sndOn ? '🔊' : '🔇';
    if (sndOn) sfx.place();
  };
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 260); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  layout();
  showRecord();
  updateCtrl();
  requestAnimationFrame(loop);
  setTimeout(function () { layout(); }, 120);
  showStart();
})();
</script>
</body>
</html>
