<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1a0e">
<meta name="description" content="泥巴菜鸡（宁波财经谐音）战糖包 · 手机五子棋，糖包超算零败，赛后出成绩单">
<title>泥巴菜鸡（宁波财经）战糖包 · 五子棋</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

      radial-gradient(85% 55% at 50% -8%,rgba(146,104,60,.95) 0%,rgba(146,104,60,0) 62%),
      radial-gradient(120% 80% at 50% 112%,rgba(24,14,5,.95) 0%,rgba(24,14,5,0) 58%),

  #room.hide{display:none}
  #room span{max-width:78vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #btnLeave,#btnRe{font-size:10px;padding:1px 7px;border-radius:8px;font-family:inherit;color:#ffd9a8;cursor:pointer;
    background:rgba(0,0,0,.3);border:1px solid rgba(255,205,140,.35)}
  #btnRe.hide,#btnLeave.hide{display:none}
  #btnRe.hide,#btnLeave.hide{display:none}
  #netbar{display:flex;gap:7px}
  #netbar.hide{display:none}
  #netbar input{flex:1;min-width:0;padding:10px 11px;border-radius:13px;font-family:inherit;font-size:13px;
    color:#ffeacb;background:rgba(0,0,0,.32);border:1.5px solid rgba(255,206,140,.28)}
  #netbar button{flex:0 0 62px;padding:10px 0;border-radius:13px;font-size:13.5px;font-weight:700;font-family:inherit;
    color:#3a2208;background:linear-gradient(180deg,#ffd79a,#efb057);border:none;box-shadow:0 3px 0 #a9702c}
  #prompt{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:13px;font-size:12.5px;color:#ffe6c4;
    background:rgba(120,72,26,.55);border:1px solid rgba(255,205,140,.4)}
  #prompt.hide{display:none}
  #prompt span{flex:1;min-width:0}
  #prompt button{padding:7px 13px;border-radius:11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;

  #prompt button#promptNo{background:linear-gradient(180deg,#6b4526,#3a2513);color:#ffe6c4}

  .linkbox{margin:10px 0;padding:10px;border-radius:12px;font-size:11.5px;line-height:1.5;word-break:break-all;

    -webkit-user-select:text;user-select:text}
  #record b{color:#ffd07a}
  #cards{display:flex;gap:8px}
  .card{flex:1;display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:15px;min-width:0;

    border:1.5px solid rgba(255,214,160,.13);transition:border-color .25s,box-shadow .25s,background .25s}
  .card.on{border-color:#ffc65c;background:linear-gradient(180deg,rgba(255,198,92,.16),rgba(0,0,0,.24));
    box-shadow:0 0 0 1px rgba(255,198,92,.3),0 0 18px rgba(255,170,60,.25)}
  .card .ava{width:38px;height:38px;flex:0 0 38px;position:relative}

  .card .meta b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tag{font-size:9px;padding:1px 6px;border-radius:8px;align-self:flex-start;
    background:rgba(0,0,0,.32);color:#f0d9b5;letter-spacing:.4px}
  .card .tag.ai{background:rgba(255,190,80,.22);color:#ffd88f}
  /* ---- 头像表情 ---- */
  .ava .rc{position:absolute;right:-3px;top:-5px;font-size:13px;opacity:0;transition:opacity .18s;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));pointer-events:none}
  .ava.r-sweat .rc-sweat,.ava.r-happy .rc-happy,.ava.r-panic .rc-panic,.ava.r-dead .rc-dead,
  .ava.r-smug .rc-smug,.ava.r-shock .rc-shock,.ava.r-worry .rc-worry{opacity:1}
  .ava.r-panic{animation:shiver .34s infinite}
  @keyframes shiver{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px) rotate(-2deg)}75%{transform:translate(1.5px,-1px) rotate(2deg)}}
  .ava.r-happy{animation:hop .52s 2}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px) scale(1.07)}}
  .ava.r-smug{animation:sway 1.3s infinite}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .ava.r-worry{animation:shiver .6s 2}

  #bubble{display:flex;gap:6px;padding:6px 10px;border-radius:12px;min-height:34px;align-items:center;

    color:#3a2208;background:linear-gradient(180deg,#ffd79a,#efb057);border:none;box-shadow:0 3px 0 #a9702c}

    border:1.5px solid rgba(255,205,140,.28);box-shadow:0 3px 0 #21140a;font-weight:600;font-size:13.5px}
  .row button:active{transform:translateY(2px)}

    background:rgba(0,0,0,.28);border:1px dashed rgba(255,205,140,.3);color:#e7d3b3}
  .warbox b{color:#ffcf7a}
  .sec{margin-top:12px;text-align:left}
  .sec h3{margin:0 0 6px;font-size:12.5px;color:#ffca7d;letter-spacing:.6px;
    border-left:3px solid #ffb347;padding-left:7px}

  table.st th,table.st td{padding:4px 5px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
  table.st th{color:#bda078;font-weight:600;font-size:10.5px}
  table.st td.k{text-align:left;color:#b9a186}
  table.st td.m{color:#e8b884;font-weight:700}
  table.st td.s{color:#ffe3a8;font-weight:700}
  ul.mist{margin:4px 0 0;padding-left:16px;font-size:11.5px;line-height:1.75;color:#dcc5a4}
  ul.mist li b{color:#ff9f7a}
  ul.mist li i{font-style:normal;color:#9fdcb0}
  .grade{display:inline-block;padding:2px 9px;border-radius:9px;font-weight:800;font-size:12px;
    background:rgba(0,0,0,.32);margin-left:4px}
  @media (orientation:landscape) and (max-height:620px){
    #app{display:grid;grid-template-columns:min(46vw,330px) 1fr;grid-template-rows:auto auto auto auto auto 1fr;
      grid-template-areas:"hd board" "cards board" "bubble board" "meters board" "cast board" "ctrl board";gap:5px 10px}
    #hd{grid-area:hd}#cards{grid-area:cards}#bubble{grid-area:bubble}#meters{grid-area:meters}
    #cast{grid-area:cast}#boardWrap{grid-area:board}#ctrl{grid-area:ctrl}
    #hd h1{font-size:min(4.4vw,22px)}
  }
</style>
</head>
<body>

    <div id="room" class="hide"><span id="roomTxt"></span><button id="btnRe" class="hide">重连</button><button id="btnLeave">退出</button></div>

        <span class="rc rc-smug">😎</span><span class="rc rc-shock">❓</span>
        <span class="rc rc-happy">👑</span><span class="rc rc-worry">🥵</span>

      <div class="meta"><b>糖包</b><span class="tag ai">食堂二楼 · 超算</span></div>

  </div>
  <div id="bubble"><b id="bubbleWho">糖包</b><span id="bubbleTxt">来啊，菜鸡。</span></div>
  <div id="meters">
    <span>泥巴度</span><div class="meter" id="meterMud"><i></i></div>

  <div id="ovl"><div id="panel"></div></div>
</div>

<script id="net">
/* ==========================================================================
   联机通道 —— 泥巴菜鸡战糖包（零依赖、零后端）
   借公共消息通道把两台手机连到一起：QQ 群点链接 → 同一房间号 → 即可对局。

   通道优先级（两边按同一顺序探测，所以正常情况下会落在同一条通道上）：
     0) MQTT broker-cn.emqx.io:8084   ← 国内节点，优先
     1) MQTT broker.emqx.io:8084
     2) ntfy.sh（HTTPS 443：POST 发 / SSE 收 / 带历史）
     3) MQTT broker.hivemq.com:8884
     4) MQTT test.mosquitto.org:8081
   注意：不同 broker 之间并不互通，所以"两边必须落在同一条通道"。
   为此做了两层保险：
     a) 顺序探测（同一个优先级顺序，网络环境相近就会一致）
     b) 消息里带通道号，房主把通道号广播出去，客人不通就 adopt() 切过去
   消息按 id 去重，因此切换/重连不会重复投递；QoS0 丢包由上层 state 重发兜底。
   本文件不碰 DOM，可单独在 node 里跑（node 22+ 自带 WebSocket/fetch）。
   ========================================================================== */
(function (global) {
  'use strict';

  var PREFIX = 'mudchess/v1/';
  var NTFY = 'https://ntfy.sh/';
  var CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  var CHANNELS = [
    { name: 'MQTT', detail: 'broker-cn.emqx.io', url: 'wss://broker-cn.emqx.io:8084/mqtt' },
    { name: 'MQTT', detail: 'broker.emqx.io', url: 'wss://broker.emqx.io:8084/mqtt' },
    { name: 'ntfy', detail: 'ntfy.sh', url: NTFY },
    { name: 'MQTT', detail: 'broker.hivemq.com', url: 'wss://broker.hivemq.com:8884/mqtt' },
    { name: 'MQTT', detail: 'test.mosquitto.org', url: 'wss://test.mosquitto.org:8081/mqtt' }
  ];

  function rid(n) { var s = ''; for (var i = 0; i < n; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
  function roomCode() { return rid(4); }
  function nowMs() { return typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now(); }

  /* ---------- MQTT 3.1.1 最小客户端 ---------- */
  function encLen(len) { var out = [], b; do { b = len % 128; len = Math.floor(len / 128); if (len > 0) b |= 128; out.push(b); } while (len > 0); return out; }
  function utf8(s) {
    var out = [];
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return out;
  }
  function mqttStr(s) { var b = utf8(s); return [(b.length >> 8) & 255, b.length & 255].concat(b); }
  function packet(type, flags, body) { return new Uint8Array([(type << 4) | flags].concat(encLen(body.length), body)); }
  function connectPacket(cid, keep) { return packet(1, 0, [0, 4, 77, 81, 84, 84, 4, 2, (keep >> 8) & 255, keep & 255].concat(mqttStr(cid))); }
  function subscribePacket(pid, topic) { return packet(8, 2, [(pid >> 8) & 255, pid & 255].concat(mqttStr(topic), [0])); }
  function publishPacket(topic, text, retain) { return packet(3, retain ? 1 : 0, mqttStr(topic).concat(utf8(text))); }
  function parsePacket(buf) {
    var b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    var type = b[0] >> 4, i = 1, mult = 1, len = 0, d;
    do { d = b[i++]; len += (d & 127) * mult; mult *= 128; } while ((d & 128) && i < b.length);
    var pl = b.subarray(i, i + len);

<script id="engine">

  function buildBg() {

  /* ---------- 绘制 ---------- */

    var i, k, s2, pt, a, d, r, R, gr;
    for (i = 0; i < stats.stains.length; i++) {
      s2 = stats.stains[i]; pt = pos(s2.cell); R = mulberry32(s2.cell * 7919 + 13);
      if (s2.kind === 'mud') {
        ctx.globalAlpha = .27; ctx.fillStyle = '#5a3a1c';
        for (k = 0; k < 6; k++) {
          a = R() * 6.2832; d = R() * CELL * .34; r = CELL * (.08 + R() * .13);
          ctx.beginPath(); ctx.arc(pt.x + Math.cos(a) * d, pt.y + Math.sin(a) * d, r, 0, 6.2832); ctx.fill();
        }
      } else {
        ctx.globalAlpha = .5; ctx.strokeStyle = '#fff8e2'; ctx.lineWidth = Math.max(1, CELL * .055);
        for (k = 0; k < 4; k++) {
          a = k * 1.5708 + .5; d = CELL * .36;
          ctx.beginPath();
          ctx.moveTo(pt.x - Math.cos(a) * d, pt.y - Math.sin(a) * d);
          ctx.lineTo(pt.x + Math.cos(a) * d, pt.y + Math.sin(a) * d);
          ctx.stroke();

    ctx.globalAlpha = 1;
  }
  function draw() {
    if (!CSSSZ || !bg) return;
    ctx.clearRect(0, 0, CSSSZ, CSSSZ);
    ctx.drawImage(bg, 0, 0, CSSSZ, CSSSZ);
    drawStains();
    var now = performance.now(), bd = G.board(), i, p, pt;
    if (lastMove >= 0 && bd[lastMove]) {
      pt = pos(lastMove);
      ctx.beginPath(); ctx.arc(pt.x, pt.y, CELL * .49, 0, 6.2832);
      ctx.strokeStyle = bd[lastMove] === aiP ? 'rgba(255,196,92,.9)' : 'rgba(255,120,80,.9)';
      ctx.lineWidth = Math.max(1.4, CELL * .075); ctx.stroke();
    }
    for (i = 0; i < SZ; i++) {
      p = bd[i]; if (!p) continue;
      pt = pos(i);
      var sc = 1, t = popAt[i];
      if (t !== undefined) {
        var k = (now - t) / 170;
        if (k < 1) sc = .5 + .5 * easeOut(k); else delete popAt[i];
      }
      var spr = p === aiP ? sprSugar : sprMud;
      var size = SPR * sc;
      ctx.drawImage(spr, pt.x - size / 2, pt.y - size / 2, size, size);
    }
    if (winCells) {
      var k2 = Math.min(1, (now - winAt) / 500), pulse = .55 + .45 * Math.sin(now / 220);
      var pa = pos(winCells[0]), pb = pos(winCells[winCells.length - 1]);

      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,214,110,' + (.35 + .3 * pulse) + ')';
      ctx.lineWidth = CELL * (.22 + .07 * pulse); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,246,200,' + (.5 + .4 * pulse) + ')';
      ctx.lineWidth = CELL * .1; ctx.stroke();
      winCells.forEach(function (c2) {
        var pc = pos(c2), sc2 = 1 + .18 * pulse;
        ctx.globalAlpha = .5 * k2;
        var gr = ctx.createRadialGradient(pc.x, pc.y, 0, pc.x, pc.y, CELL * .7 * sc2);
        gr.addColorStop(0, 'rgba(255,235,150,.85)'); gr.addColorStop(1, 'rgba(255,200,80,0)');
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(pc.x, pc.y, CELL * .7 * sc2, 0, 6.2832); ctx.fill();

      });

    for (i = 0; i < particles.length; i++) {

  function stepParticles() {
    var alive = [];

      var q = particles[i];

  }
  function spawn(cell, kind) {

      var a = Math.random() * 6.2832, sp = 25 + Math.random() * 95;
      particles.push({
        x: pt.x + (Math.random() - .5) * CELL * .3, y: pt.y + (Math.random() - .5) * CELL * .3,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 45, r: 1.3 + Math.random() * 2.6, life: 1,

  /* 状态一变就同步重绘：不依赖动画帧（切后台时浏览器会暂停 rAF） */

  /* ---------- 战术统计 ---------- */
  function resetStats() {
    stats = {
      mud: {
        moves: 0, ms: 0, five: 0, four: 0, openFour: 0, three: 0, blockFour: 0, blockThree: 0,
        quiet: 0, blunder: 0, inacc: 0, best: 0, missWin: 0, topCell: -1, topScore: -1, topPly: 0
      },
      sugar: {
        moves: 0, ms: 0, nodes: 0, maxDepth: 0, five: 0, four: 0, openFour: 0, three: 0,
        blockFour: 0, blockThree: 0, quiet: 0, verdictPly: 0, verdictCell: -1,
        blunder: 0, inacc: 0, best: 0, missWin: 0, topCell: -1, topScore: -1, topPly: 0

  }
  /* 落子前判断这一手的性质 */
  function judge(cell, p) {
    var opp = 3 - p, r = G.report(p);
    var s1 = G.cellScore(cell, p), s2 = G.cellScore(cell, opp);
    var played = s1 + s2 * 0.9, best = r.bestScore;
    var kind = 'quiet';
    if (s1 >= S.FIVE) kind = 'five';
    else if (s1 >= S.OPEN_FOUR) kind = 'openFour';
    else if (s1 >= S.FOUR) kind = 'four';
    else if (s1 >= S.OPEN_THREE) kind = 'three';
    else if (s2 >= S.FOUR) kind = 'blockFour';
    else if (s2 >= S.OPEN_THREE) kind = 'blockThree';
    return {
      kind: kind, my: s1, opp: s2, played: played, best: best, bestMove: r.bestMove,
      loss: best - played, winCells: r.win, blockCells: r.block,
      missedWin: r.win.length > 0 && r.win.indexOf(cell) < 0,

  }
  function tagOf(j) {
    if (j.missedWin) return '漏胜';
    if (j.missedBlock) return '漏挡（对手冲四没管）';
    if (j.kind === 'five') return '成五';
    if (j.kind === 'openFour') return '活四';
    if (j.kind === 'four') return '冲四';
    if (j.kind === 'three') return '活三';
    if (j.kind === 'blockFour') return '挡冲四';
    if (j.kind === 'blockThree') return '挡活三';
    if (j.loss > 45000) return '大漏着';
    if (j.loss > 15000) return '失着';
    if (j.loss > 4000) return '缓手';
    return '闲手';
  }
  /* 统计口径：单机时"泥巴=人 / 糖包=AI"；联机时"泥巴=座位1 / 糖包=座位2" */
  function keyOf(p) { return online.on ? (p === 1 ? 'mud' : 'sugar') : (p === aiP ? 'sugar' : 'mud'); }
  function avatarOf(p) { return p === 1 ? 'mud' : 'sugar'; }
  function whoName(p) { return online.on ? seatName(p) : (p === aiP ? '糖包' : '菜鸡'); }
  function recordMove(p, cell, j, ply) {
    var who = keyOf(p), st = stats[who], tag = tagOf(j);
    st.moves++;
    if (j.kind === 'five') st.five++;
    else if (j.kind === 'openFour') st.openFour++;
    else if (j.kind === 'four') st.four++;
    else if (j.kind === 'three') st.three++;
    else if (j.kind === 'blockFour') st.blockFour++;
    else if (j.kind === 'blockThree') st.blockThree++;
    else st.quiet++;
    if (j.played > st.topScore) { st.topScore = j.played; st.topCell = cell; st.topPly = ply; }
    if (!online.on && p === aiP) return;                       // 单机时只记人的失误
    var bad = j.missedWin || j.missedBlock || j.loss > 45000;
    if (bad) {
      st.blunder++;
      stats.mistakes.push({
        ply: ply, cell: cell, tag: tagOf(j), loss: Math.round(j.loss), side: who,
        suggest: j.missedWin && j.winCells.length ? j.winCells[0] : j.bestMove
      });
      stats.stains.push({ cell: cell, kind: avatarOf(p) });
      reaction(avatarOf(p), 'panic');
      castLine(whoName(p) + ' 这一手 <b>' + nm(cell) + '</b> —— ' + tag + '，教务处看了都摇头。');
    } else if (j.loss > 15000) {
      st.inacc++;

    } else if (j.played >= j.best - 1) {

      h += sec('糖包的高光时刻（教务系统：糖包 100 分）',
        '<div class="tip" style="text-align:left">第 <b style="color:#ffcf7a">' + sg.verdictPly + '</b> 手落在 <b style="color:#ffcf7a">' +
        nm(sg.verdictCell) + '</b> 之后，它已经算出必胜路线 —— 那时候它就知道你输了。</div>');
    }
    if (m.topCell >= 0) {
      h += sec('你的满分那一手（本局唯一亮点）', '<div class="tip" style="text-align:left">第 <b style="color:#ffcf7a">' + m.topPly +
        '</b> 手 <b style="color:#ffcf7a">' + nm(m.topCell) + '</b>（评分 ' + Math.round(m.topScore) +
        '）—— 宁财泥巴也有闪光时刻。</div>');
    }
    return h;
  }

  /* ---------- 交互 ---------- */
  function hit(ev) {
    var rect = cv.getBoundingClientRect();
    var x = (ev.clientX - rect.left) * (CSSSZ / rect.width);
    var y = (ev.clientY - rect.top) * (CSSSZ / rect.height);
    var c = Math.round((x - PAD) / CELL), r = Math.round((y - PAD) / CELL);
    if (r < 0 || r >= N || c < 0 || c >= N) return -1;
    if (Math.hypot(x - (PAD + c * CELL), y - (PAD + r * CELL)) > CELL * .62) return -1;
    return r * N + c;
  }
  cv.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    if (over || thinking || turnP() !== humanP) return;
    var cell = hit(ev);
    if (cell < 0 || G.board()[cell] !== 0) return;
    humanMove(cell);
  }, { passive: false });
  cv.addEventListener('pointermove', function (ev) {
    if (ev.pointerType === 'touch') return;
    var cell = hit(ev);
    if (cell !== hoverCell) { hoverCell = cell; dirty = true; }
  });
  cv.addEventListener('pointerleave', function () { hoverCell = -1; dirty = true; });

  /* ---------- 对局流程 ---------- */
  function turnP() { return hist.length % 2 === 0 ? 1 : 2; }
  function newGame(aiFirst) {
    if (online.on) onlineLeave();
    G.newGame();
    hist = []; snaps = [G.snapshot()];
    undoLeft = 2; over = false; thinking = false; lastMove = -1; winCells = null;
    popAt = {}; particles = []; hoverCell = -1;
    resetStats();
    humanP = aiFirst ? 2 : 1; aiP = 3 - humanP;
    $('avaMud').className = 'ava'; $('avaSugar').className = 'ava';
    $('ovl').classList.add('hide');
    $('think').classList.add('hide');
    showRecord(); updateCtrl();
    turnStart = gameStart = performance.now();
    markTurn(); updateMeters();
    turn();
    say(aiFirst ? 'sugar' : 'mud', aiFirst ? pick(SUGAR_LINES, 's') : pick(MUD_LINES, 'm'));
    castLine(aiFirst ? '糖包天元开局，菜鸡请接招。' : '菜鸡先手，解说：勇气可嘉。');
    render();
  }
  function markTurn() {
    var p = turnP();
    $('cardMud').classList.toggle('on', !over && p === humanP);
    $('cardSugar').classList.toggle('on', !over && p === aiP);
  }
  function updateCtrl() {
    $('undoLeft').textContent = undoLeft;
    $('btnUndo').disabled = over || thinking || undoLeft <= 0 ||
      (online.on && (online.seat === 0 || !online.ready));
    $('btnNew').textContent = online.on ? '认输' : '重开';
    $('btnSwap').textContent = online.on ? '邀请' : '换先手';
    $('btnNew').disabled = online.on ? (online.seat === 0 || over) : false;
    $('btnSwap').disabled = thinking;
  }
  function turn() {
    markTurn();
    if (over) return;
    if (online.on) {                                   // 联机：只提示轮到谁，不跑 AI
      var tp = turnP();
      if (online.seat === 0) { castLine('围观中：' + seatName(1) + ' / ' + seatName(2) + ' 正在对局（可以发弹幕）'); return; }
      if (tp === humanP) { turnStart = performance.now(); sayP(humanP, '轮到你了。'); }
      else { sayP(tp, '……'); castLine('等 ' + seatName(tp) + ' 落子…'); }
      return;
    }
    if (turnP() === aiP) aiPlay();
    else { turnStart = performance.now(); say('mud', '该你了，落子吧。'); }
  }
  function commit(cell, p) {
    if (!G.play(cell, p)) return false;
    hist.push({ i: cell, p: p });
    snaps.push(G.snapshot());
    lastMove = cell; popAt[cell] = performance.now();
    spawn(cell, p === aiP ? 'sugar' : 'mud');
    return true;
  }
  function humanMove(cell) {
    var j = judge(cell, humanP);
    stats[keyOf(humanP)].ms += performance.now() - turnStart;
    recordMove(humanP, cell, j, hist.length + 1);
    if (!commit(cell, humanP)) return;
    sfx.place();
    updateMeters();
    var line = G.winLine(cell, humanP);
    if (line) { endGame(humanP, line); return; }
    if (hist.length >= SZ) { endGame(0, null); return; }
    if (online.on) {                                   // 联机：把这一手广播出去
      netSend({ t: 'move', n: hist.length - 1, cell: cell });
      if (online.host) broadcastState(false);
      render(); updateCtrl(); turn();
      return;
    }
    /* 糖包的反应：菜鸡下手狠了会吓一跳 */
    var r2 = G.report(aiP);
    if (r2.win.length || (j.kind !== 'quiet' && j.kind !== 'blockThree' && j.my >= S.OPEN_THREE)) {
      reaction(avatarOf(aiP), 'shock'); say('sugar', pick(SUGAR_SHOCK, 'sh'));
    } else if (j.played >= j.best - 1 && stats.mud.best % 3 === 0) {
      say('mud', pick(MUD_GOOD, 'good'));
    }
    updateCtrl();
    turn();
  }
  function aiPlay() {
    thinking = true; updateCtrl(); markTurn();
    $('think').classList.remove('hide');
    $('thinkTxt').textContent = '糖包在算…';
    setTimeout(function () {
      var r;
      try { r = G.think(aiP, AI_TIME); }
      catch (e) {
        var cand = G.candidates();
        r = { move: cand.length ? cand[0] : 112, depth: 0, nodes: 0, ms: 0, score: 0 };
      }
      var mv = r.move >= 0 ? r.move : 112;
      var jj = judge(mv, aiP);
      thinking = false;
      $('think').classList.add('hide');
      stats.sugar.nodes += r.nodes || 0;
      stats.sugar.ms += r.ms || 0;
      if (r.depth > stats.sugar.maxDepth) stats.sugar.maxDepth = r.depth;
      var ply = hist.length + 1;
      var firstVerdict = r.win && !stats.sugar.verdictPly;
      if (firstVerdict) { stats.sugar.verdictPly = ply; stats.sugar.verdictCell = mv; }
      recordMove('sugar', mv, jj, ply);
      if (!G.board()[mv]) commit(mv, aiP);
      sfx.sugar();
      updateMeters(); updateCtrl();
      var line = G.winLine(mv, aiP);
      if (line) { endGame(aiP, line); return; }
      if (hist.length >= SZ) { endGame(0, null); return; }
      if (r.win) {
        reaction('sugar', 'happy'); reaction('mud', 'panic'); say('sugar', pick(SUGAR_KILL, 'k'));
        if (firstVerdict) castLine('教务系统已录入：糖包 <b>100</b> 分，泥巴 <b>59</b> 分（差一分及格）。');
      }
      else if (jj.kind === 'four' || jj.kind === 'openFour') { reaction('mud', 'sweat'); say('sugar', pick(SUGAR_FOUR, 'f')); }
      else if (jj.kind === 'blockFour' || jj.kind === 'blockThree') say('sugar', pick(SUGAR_BLOCK, 'bl'));
      else if (G.evalFor(humanP) < -120000) { reaction('sugar', 'smug'); say('sugar', pick(SUGAR_BORED, 'bo')); }
      else say('sugar', pick(SUGAR_LINES, 's'));
      if (G.evalFor(humanP) < -400000) reaction('mud', 'sweat');
      render();
      turn();
    }, 60);
  }
  function undo() {
    if (over || thinking || undoLeft <= 0) return;
    if (online.on) { onlineUndoAsk(); return; }        // 联机要对方同意
    var k = hist.length, removedHuman = false;
    while (k > 0 && hist[k - 1].p === aiP) k--;
    if (k > 0 && hist[k - 1].p === humanP) { k--; removedHuman = true; }
    if (!removedHuman) return;
    hist = hist.slice(0, k);
    snaps = snaps.slice(0, k + 1);
    G.restore(snaps[k]);
    undoLeft--;
    over = false; winCells = null;
    lastMove = k > 0 ? hist[k - 1].i : -1;
    popAt = {}; particles = []; hoverCell = -1;
    if (stats.stains.length) stats.stains.pop();
    sfx.undo();
    updateCtrl(); updateMeters();
    turn();
    say('mud', '这手不算，我重下！');
    castLine('悔棋 ×1 —— 泥巴可以糊第二次。');
    render();
  }
  function endGame(winner, line) {
    over = true; thinking = false; winCells = line; winAt = performance.now();
    $('think').classList.add('hide');
    if (online.on) {                                   // 联机记到联机战绩
      if (winner === humanP) { record.onlineW = (record.onlineW || 0) + 1; sfx.win(); }
      else if (winner) { record.onlineL = (record.onlineL || 0) + 1; sfx.lose(); }
      else sfx.undo();
      record.games = (record.games || 0) + 1;
      record.blunders = (record.blunders || 0) + (stats.mud.blunder + stats.sugar.blunder);
      saveRecord(); showRecord(); lbAfterGame(winner, hist.length);
      if (online.host) broadcastState(true);
    } else {
      if (winner === aiP) { record.sugar++; record.blunders += stats.mud.blunder; sfx.lose(); }
      else if (winner === humanP) { record.chick++; sfx.win(); }
      else { record.draw++; sfx.undo(); }
      record.games = (record.games || 0) + 1;
      saveRecord(); showRecord(); lbAfterGame(winner, hist.length);
    }
    updateCtrl(); markTurn();
    if (winner && winner !== 0) {
      reaction(avatarOf(winner), 'happy'); reaction(avatarOf(3 - winner), 'dead');
      if (winner === humanP && !online.on) say('mud', pick(MUD_WIN, 'w'));
    }
    render();
    setTimeout(function () { showResult(winner); }, line ? 1600 : 400);
  }
  function showResult(winner) {
    var head, buttons;
    if (online.on) {
      head = !winner ? '<h2>平局</h2><div class="sub">手数用尽，谁也没连成五。</div>'
        : winner === humanP ? '<h2>你赢了 🏆</h2><div class="sub">' + seatName(humanP) + ' 拿下这一局，成绩单在下面。</div>'
          : '<h2>' + seatName(winner) + ' 赢了</h2><div class="sub">成绩单已出，看看谁的绩点低。</div>';
      buttons = '<button id="againAi">再来一局（等对方同意）</button>' +
        '<button id="againMe" class="ghost">复制邀请链接（叫更多人来看）</button>' +
        '<button id="againSame" class="ghost">先看看这盘棋</button>' +
        '<button id="againBoard" class="ghost">看排行榜 🏆</button>';
    } else {
      head = winner === aiP ? '<h2>糖包赢了 🍬</h2><div class="sub">成绩单已出：' + pick(SUGAR_WIN, 'w') + '</div>'
        : winner === humanP ? '<h2>不可能…你赢了？！</h2><div class="sub">糖包：一定是手机卡了。</div>'
          : '<h2>平局</h2><div class="sub">泥巴和糖糊成一团了。</div>';
      buttons = '<button id="againAi">再来一局（糖包先走）</button>' +
        '<button id="againMe" class="ghost">再来一局（我先走）</button>' +
        '<button id="againSame" class="ghost">先看看这盘棋</button>';
    }
    $('panel').innerHTML = head +
      '<div class="row">' + buttons + '</div>' + buildReport(winner) +
      '<div class="tip">绩点看的是「漏挡 / 漏胜 / 大漏着」；棋盘上的泥渍就是你的挂科痕迹（笑）。<br>' +      '每局 2 次悔棋，只能悔自己的棋。</div>';
    $('ovl').classList.remove('hide');
    $('againAi').onclick = function () {
      if (!online.on) { newGame(true); return; }
      netSend({ t: 'reset' });
      castLine('已发出"再来一局"，等对方同意…');
      $('ovl').classList.add('hide');
    };
    $('againMe').onclick = function () {
      if (!online.on) { newGame(false); return; }
      copyInvite();
    };
    $('againSame').onclick = function () { $('ovl').classList.add('hide'); };
    if ($('againBoard')) $('againBoard').onclick = function () { showLeaderboard(); };
    $('panel').scrollTop = 0;
  }
  function showStart() {

  /* ==========================================================================
     联机对战（QQ 群约战）
     协议（全部走同一房间通道，JSON）：
       hello   {nick, host, seat}                 报到（房主带 host:1）
       seat    {to, seat, nick}                   房主分配座位：1=泥巴(先手) 2=糖包 0=围观
       seats   {1:nick, 2:nick}                   广播两边昵称
       state   {moves:[cell…], first, n}          权威局面（房主发，用于同步/重连）
       move    {n, cell}                          落子（n = 第几手，从 0 开始）
       undo    {} / undoAck {ok}                  悔棋请求 / 应答
       reset   {} / resetAck {ok}                 再来一局
       resign  {}                                 认输
       chat    {nick, text}                        群聊弹幕
       sync    {}                                 请求对方补发 state
       bye     {}                                  离开
     ========================================================================== */
  var online = {
    on: false, room: '', nick: '', host: false, seat: 0,
    net: null, ready: false, chan: -1, chanText: '', peer: '', nicks: { 1: '', 2: '' },
    lastPeer: 0, lastStateLen: -1, adoptCount: 0, adoptAt: 0,
    undoAsk: false, resetAsk: false, over: false
  };

  function savedNick() { try { return localStorage.getItem('mudGomokuNick') || ''; } catch (e) { return ''; } }
  function saveNick(n) { try { localStorage.setItem('mudGomokuNick', n); } catch (e) { } }

  function seatName(p) {
    if (!online.on) return p === aiP ? '糖包' : '你';
    if (p === online.seat) return (online.nick || '你');
    return online.nicks[p] || ('座位' + p);
  }
  function sayP(p, text) {
    $('bubbleWho').textContent = (p === humanP ? '' : '') + seatName(p) + '：';
    $('bubbleTxt').textContent = text;
    $('bubble').className = (p === humanP ? 'mud' : 'sugar');
  }
  function roomBar() {
    if (!online.on) { $('room').classList.add('hide'); return; }
    var st = ['房间 ' + online.room];
    if (online.seat === 0) st.push('围观中（' + seatName(1) + ' vs ' + seatName(2) + '）');
    else st.push(seatName(online.seat) + ' vs ' + seatName(3 - online.seat));
    if (online.ready) st.push(online.chanText);
    $('roomTxt').textContent = st.join(' · ');
    $('room').classList.remove('hide');
    $('btnRe').classList.toggle('hide', !!online.ready);
  }
  function netStatus(s, d) {
    if (s === 'connected') { online.ready = true; $('room').style.opacity = ''; }
    else if (s === 'failed') { castLine('联机通道连不上（' + (d || '') + '）· 点房间条上的"重连"或换个网络'); $('room').style.opacity = '.7'; }
    else castLine('联机状态：' + (d || s));
    roomBar();
  }

  function inviteLink() {
    return location.origin + location.pathname + '?r=' + online.room;
  }
  function copyInvite() {
    var link = inviteLink();
    function ok() { castLine('邀请链接已复制，粘到 QQ 群里就行：' + link); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(ok, function () { fallback(); });
        return;
      }
    } catch (e) { }
    fallback();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = link; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); } catch (e) { }
      document.body.removeChild(ta);
      ok();
    }
  }

  /* ---------- 进出房间 ---------- */
  function onlineEnter(room, asHost) {
    online.on = true; online.room = room; online.host = !!asHost; online.seat = asHost ? 1 : 0;
    online.nicks = { 1: '', 2: '' }; online.over = false; online.lastStateLen = -1;
    online.seatTaken2 = false; online.seat2Id = ''; online.helloAt = performance.now();
    online.nick = ($('nickIn') && $('nickIn').value.trim()) || savedNick() || ('群友' + Math.floor(Math.random() * 90 + 10));
    saveNick(online.nick);
    try { history.replaceState(null, '', location.pathname + '?r=' + room + (asHost ? '&h=1' : '')); } catch (e) { }
    resetStats();
    onlineBoard();
    $('ovl').classList.add('hide');
    $('netbar').classList.remove('hide');
    $('pun').classList.add('hide');
    roomBar();
    castLine('正在连接联机通道…');
    online.net = globalThis.GomokuNet.connect({
      room: room,
      onStatus: netStatus,
      onReady: function (info) {
        online.ready = true; online.chan = info.chan;
        online.chanText = info.transport + '·' + info.detail;
        netSend({ t: 'hello', nick: online.nick, host: online.host ? 1 : 0, seat: online.seat });
        netSend({ t: 'sync' });
        castLine(info.reconnected ? '已重连（' + online.chanText + '）' : '已连上通道 ' + online.chanText + '，把房间号发到群里等人来');
        roomBar();
      },
      onMsg: netMsg
    });
  }
  function onlineLeave() {
    if (!online.on) return;
    netSend({ t: 'bye' });
    if (online.net) online.net.close();
    online.on = false; online.ready = false; online.seat = 0; online.net = null;
    $('netbar').classList.add('hide');
    $('prompt').classList.add('hide');
    $('pun').classList.remove('hide');
    $('room').classList.add('hide');
    try { history.replaceState(null, '', location.pathname); } catch (e) { }
    showStart();
  }
  function onlineBoard() {
    G.newGame();
    hist = []; snaps = [G.snapshot()];
    undoLeft = 2; over = false; thinking = false; lastMove = -1; winCells = null;
    popAt = {}; particles = []; hoverCell = -1;
    humanP = online.seat === 2 ? 2 : 1;
    aiP = 3 - humanP;
    gameStart = performance.now();
    resetStats();
    roomBar(); updateCtrl(); markTurn(); render();
  }
  function netSend(o) { return online.net ? online.net.send(o) : false; }

  /* ---------- 房主把局面广播出去 ---------- */
  function broadcastState(force) {
    if (!online.on) return;
    if (!force && hist.length === online.lastStateLen) return;
    online.lastStateLen = hist.length;
    var mv = [];
    for (var i = 0; i < hist.length; i++) mv.push(hist[i].i);
    netSend({ t: 'state', moves: mv });
  }
  /* 用着法序列重建棋盘（同步/重连/悔棋都用它） */
  function applyMoves(list) {
    G.newGame();
    hist = []; snaps = [G.snapshot()];
    for (var i = 0; i < list.length; i++) {
      var p = i % 2 === 0 ? 1 : 2;
      if (!G.play(list[i], p)) break;
      hist.push({ i: list[i], p: p });
      snaps.push(G.snapshot());
    }
    lastMove = hist.length ? hist[hist.length - 1].i : -1;
    winCells = null; over = false;
    resetStats();
    render(); updateCtrl(); markTurn();
    if (hist.length) {
      var last = hist[hist.length - 1];
      var ln = G.winLine(last.i, last.p);
      if (ln) endGame(last.p, ln);
    }
  }
  function netMsg(m) {
    if (m.from !== 'sys') online.lastPeer = performance.now();
    /* 通道不一致：客人跟随房主；否则往小号通道靠 */
    if (typeof m.ch === 'number' && m.ch >= 0 && online.chan !== m.ch && m.t !== 'bye') {
      var mine = online.chan;
      if (mine >= 0 && mine !== m.ch) {
        var now = performance.now();
        if (now - online.adoptAt > 6000 && online.adoptCount < 3 && m.ch < mine) {
          online.adoptAt = now; online.adoptCount++;
          online.net.adopt(m.ch);
          castLine('与对方不在同一通道，正在切到 ' + m.ch + ' 号通道…');
          return;
        }
      }
    }
    switch (m.t) {
      case 'hello':
        if (m.host) { if (m.seat === 1) online.sawHost = true; else if (online.host) { online.sawHost = true; } }
        if (m.nick) { if (m.seat === 1 || m.seat === 2) online.nicks[m.seat] = m.nick; online.peer = m.from; }
        if (online.host) {                              // 房主：分配座位
          online.peer = m.from;
          if (!online.seatTaken2 && m.seat !== 1) {
            online.seatTaken2 = true;
            online.nicks[2] = m.nick || '群友';
            online.nicks[1] = online.nick;
            online.seat2Id = m.from;
            netSend({ t: 'seat', to: m.from, seat: 2, nick: online.nick });
            netSend({ t: 'seats', nick1: online.nick, nick2: online.nicks[2] });
            broadcastState(true);
            castLine('对手来了：' + online.nicks[2] + '（' + online.room + ' 房间开打）');
            sayP(2, '来了？那就开始吧。');
          } else if (m.seat !== 1) {
            netSend({ t: 'seat', to: m.from, seat: 0 });
            netSend({ t: 'seats', nick1: online.nick, nick2: online.nicks[2] || '' });   // 后进来的观众也能看到两边名字
            if (hist.length) broadcastState(true);
            castLine('又进来一位：' + (m.nick || '群友') + ' 先当观众（这局两人在打）');
          }
        }
        roomBar();
        break;
      case 'seat':
        if (m.to === (online.net && online.net.id) || !m.to) {
          online.seat = m.seat;
          if (m.seat === 2 && m.nick) online.nicks[1] = m.nick;
          humanP = online.seat === 2 ? 2 : 1; aiP = 3 - humanP;
          if (m.seat === 1) online.nicks[1] = online.nick;
          if (m.seat === 2) online.nicks[2] = online.nick;
          roomBar(); markTurn(); render();
          if (m.seat === 0) castLine('房间里已经有两个人在打了，你先围观（可以发弹幕）');
          else { castLine('你是 ' + (m.seat === 1 ? '泥巴方（先手）' : '糖包方（后手）')); netSend({ t: 'sync' }); }
        }
        break;
      case 'seats':
        online.sawHost = true;
        if (m.nick1) online.nicks[1] = m.nick1;
        if (m.nick2) online.nicks[2] = m.nick2;
        roomBar(); break;
      case 'state':
        online.sawHost = true;
        online.nicks[1] = online.nicks[1] || (m.nick1 || '');
        if (m.moves && m.moves.length !== hist.length) applyMoves(m.moves);
        break;
      case 'move':
        if (m.n > hist.length) { netSend({ t: 'sync' }); break; }
        if (m.n < hist.length) break;
        onlineApply(m.cell, m.n);
        break;
      case 'sync':
        if (online.seat === 1 && hist.length) broadcastState(true);
        break;
      case 'undo':
        if (online.seat === 0 || (m.seat !== 1 && m.seat !== 2)) break;
        onlinePrompt(seatName(m.seat) + ' 想悔棋（撤两手）', function () {
          netSend({ t: 'undoAck', ok: true, seat: online.seat });
          doUndoLocal();
        }, function () { netSend({ t: 'undoAck', ok: false }); castLine('你拒绝了对方的悔棋'); });
        break;
      case 'undoAck':
        if (m.ok) { doUndoLocal(); castLine('对方同意悔棋，撤了两手'); }
        else castLine('对方拒绝了你的悔棋请求');
        break;
      case 'reset':
        onlinePrompt('对方想再来一局', function () {
          netSend({ t: 'resetAck', ok: true }); onlineBoard(); castLine('新的一局，开打！');
        }, function () { netSend({ t: 'resetAck', ok: false }); castLine('你拒绝了再来一局'); });
        break;
      case 'resetAck':
        if (m.ok) { onlineBoard(); castLine('对方同意，新的一局开始'); }
        else castLine('对方暂时不想再来一局');
        break;
      case 'resign':
        endGame(humanP, null);
        castLine('对方认输了，你赢了！');
        break;
      case 'chat':
        sayP(m.side === 2 ? 2 : 1, m.text);
        break;
      case 'bye':
        if (online.host && m.from === online.seat2Id) {      // 2 号位走了，腾出来给回来的人
          online.seatTaken2 = false; online.seat2Id = '';
          online.nicks[2] = '';
          netSend({ t: 'seats', nick1: online.nick, nick2: '' });
          roomBar();
          castLine('对手离开了房间，2 号位空出来了（房间号 ' + online.room + '，让群友点链接回来就能接着下）');
        } else castLine('有人离开了房间（房间号 ' + online.room + ' 还在，回来会自动同步）');
        break;
    }
  }

  function onlineApply(cell) {
    if (cell < 0 || cell > 224 || G.board()[cell] !== 0) return;
    var p = hist.length % 2 === 0 ? 1 : 2;
    var j = judge(cell, p);
    recordMove(p, cell, j, hist.length + 1);
    if (!commit(cell, p)) return;
    sfx.place();
    updateMeters();
    var ln = G.winLine(cell, p);
    if (ln) { endGame(p, ln); return; }
    if (hist.length >= SZ) { endGame(0, null); return; }
    if (online.host) broadcastState(false);
    render(); updateCtrl(); turn();
  }
  function doUndoLocal() {
    if (!hist.length) return;
    var k = Math.max(0, hist.length - 2);          // 固定撤两手，两边算法一致
    var list = [];
    for (var i = 0; i < k; i++) list.push(hist[i].i);
    applyMoves(list);
    if (online.host) broadcastState(true);
  }
  function onlinePrompt(text, onYes, onNo) {
    $('promptTxt').textContent = text;
    $('prompt').classList.remove('hide');
    $('promptYes').onclick = function () { $('prompt').classList.add('hide'); onYes(); };
    $('promptNo').onclick = function () { $('prompt').classList.add('hide'); onNo(); };
  }
  function onlineUndoAsk() {
    if (undoLeft <= 0) { castLine('悔棋机会用完了（每局 2 次）'); return; }
    if (!online.ready) { castLine('还没连上通道，等一下再点'); return; }
    undoLeft--; updateCtrl();
    netSend({ t: 'undo', seat: online.seat });
    castLine('已发出悔棋请求，等对方同意…');
  }
  function onlineChat() {
    var t = $('chatIn').value.trim();
    if (!t) return;
    $('chatIn').value = '';
    netSend({ t: 'chat', nick: online.nick, side: online.seat, text: t.slice(0, 40) });
    sayP(humanP, online.nick + '：' + t.slice(0, 40));
  }
  /* 每 400ms 心跳：房主补发局面 / 掉线提示 / 房主失效接管 */
  setInterval(function () {
    if (!online.on) return;
    if (!online.host && online.seat === 0 && online.ready && online.helloAt &&
        performance.now() - online.helloAt > 15000 && !online.sawHost) {
      online.host = true; online.seat = 1; online.seatTaken2 = false; online.seat2Id = '';
      online.nicks[1] = online.nick; humanP = 1; aiP = 2;
      online.sawHost = true;
      netSend({ t: 'hello', nick: online.nick, host: 1, seat: 1 });
      netSend({ t: 'seats', nick1: online.nick, nick2: '' });
      castLine('房主好像不在了，你接替他当房主（执泥巴·先手）');
      roomBar(); markTurn(); render();
    }
    if (online.seat === 1 && online.ready && !over) broadcastState(false);
    if (online.ready && online.lastPeer && performance.now() - online.lastPeer > 25000 && !over) {
      castLine('对方好像掉线了…等他回来会自动同步（房间号 ' + online.room + '）');
      online.lastPeer = performance.now() + 1e7;
    }
    roomBar();
  }, 400);

  /* ---------- 联机版成绩单（双方都有） ---------- */
  function buildReportOnline(winner) {
    var s1 = stats.mud, s2 = stats.sugar, n1 = seatName(1), n2 = seatName(2);
    var h = '';
    var avg = function (s) { return s.moves ? s.ms / s.moves : 0; };
    var dur = Math.max(1, Math.round((performance.now() - gameStart) / 1000));
    h += '<div class="warbox">' +
      '<b>房间：</b>' + online.room + ' · 通道 ' + (online.chanText || '-') + ' · 共 ' + hist.length + ' 手 · 用时约 ' + dur + ' 秒' +
      '<br><b>对局：</b>' + n1 + '（泥巴·先手） vs ' + n2 + '（糖包·后手）' +

      n2 + ' 平均 ' + (avg(s2) / 1000).toFixed(1) + ' 秒/手' +

        '<td class="m" style="color:' + g.c + '">' + g.gpa + '（' + g.g + '）</td>' +
        '<td class="' + r[2] + '" style="text-align:left;font-size:11px">' + g.t + '</td></tr>';
    });
    h += sec('成绩单（双方）', '<table class="st"><tr><th></th><th>绩点</th><th>评语</th></tr>' + gradeRows + '</table>');
    h += sec('战术统计', '<table class="st">' +
      '<tr><th></th><th>' + n1 + '</th><th>' + n2 + '</th></tr>' +

      row3('活四 / 成五', s1.openFour + ' / ' + s1.five, s2.openFour + ' / ' + s2.five) +
      row3('挡活三', s1.blockThree, s2.blockThree) +

      row3('最高评分', s1.topCell >= 0 ? nm(s1.topCell) + ' (' + Math.round(s1.topScore) + ')' : '—',
        s2.topCell >= 0 ? nm(s2.topCell) + ' (' + Math.round(s2.topScore) + ')' : '—') +
      '</table>');
    var li = '';
    stats.mistakes.slice(0, 6).forEach(function (k) {
      li += '<li>第 <b>' + k.ply + '</b> 手 <b>' + nm(k.cell) + '</b> —— ' + k.tag +
        (k.suggest >= 0 && k.suggest !== k.cell ? '，其实该下 <i>' + nm(k.suggest) + '</i>' : '') + '</li>';
    });

      : '<div class="tip" style="text-align:left">两位都零挂科，这局质量不错。</div>');
    if (stats.mistakes.length) {
      var k0 = stats.mistakes[0];
      h += sec('本局转折点', '<div class="tip" style="text-align:left">第 <b style="color:#ffcf7a">' + k0.ply +
        '</b> 手 <b style="color:#ffcf7a">' + nm(k0.cell) + '</b> —— ' + k0.tag + '，从这里开始天平移了。</div>');
    }
    h += '<div class="tip">房间号 ' + online.room + ' 还能继续用：让群友点链接进来就能接着下（多的人自动当观众，可以发弹幕）。</div>';
    return h;
  }

  /* ==========================================================================
     排行榜：本地战绩 + 全网共享榜
     共享榜用"最后一个写入者覆盖"的方式挂在公共通道上（MQTT retain / ntfy 缓存），
     所以即使没有后端，晚来的人也能读到榜（retain/缓存消息一进房间就到手）。
     成绩是各人手机自己上报的，只为图个乐；同昵称取较高积分。
     ========================================================================== */
  var LB_ROOM = 'TOP1';
  var lb = { net: null, ready: false, entries: {}, open: false, gotShared: false };

  function lbScore(e) {
    var s = (e.w || 0) * 10;
    if (e.ko) s += Math.max(0, 30 - e.ko);        // 越快取胜加分越多
    s -= Math.round((e.bl || 0) * 1.5);           // 失误扣分
    if (e.d) s += (e.d || 0) * 2;
    return s;
  }
  function lbMine() {
    var nick = (online.on && online.nick) || savedNick() || '匿名泥巴';
    var e = {
      nick: nick,
      w: (record.chick || 0) + (record.onlineW || 0),
      l: (record.sugar || 0) + (record.onlineL || 0),
      d: record.draw || 0,
      bl: record.blunders || 0,
      ko: record.fastWin || 0,
      ts: Date.now()
    };
    e.pts = lbScore(e);
    return e;
  }
  function lbSorted() {
    var arr = [];
    for (var k in lb.entries) if (lb.entries[k]) arr.push(lb.entries[k]);
    arr.sort(function (a, b) { return (b.pts || 0) - (a.pts || 0); });
    return arr.slice(0, 20);
  }
  function lbPublish(retain) {
    if (!lb.net || !lb.ready) return false;
    var me = lbMine();
    lb.entries[me.nick] = me;
    netLbSend({ t: 'lb', board: lbSorted(), nick: me.nick }, retain !== false);
    return true;
  }
  function netLbSend(o, retain) { if (lb.net) lb.net.send(o, retain); }
  function lbConnect() {
    if (lb.net) { lbPublish(true); return; }
    lb.net = globalThis.GomokuNet.connect({
      room: LB_ROOM, since: 'all',
      onStatus: function (s, d) {
        if (s === 'failed') { if (lb.open) lbRender('榜单暂时连不上（' + (d || '') + '），下面是你本机的战绩'); }
      },
      onReady: function (info) {
        lb.ready = true;
        netLbSend({ t: 'lb-req' });
        lbPublish(true);
        if (lb.open) lbRender();
      },
      onMsg: function (m) {
        if (m.t === 'lb-req') { lbPublish(true); return; }
        if (m.t !== 'lb' || !m.board) return;
        lb.gotShared = true;
        var mine = lbMine().nick, changed = false;
        m.board.forEach(function (e) {
          if (!e || !e.nick || e.nick === mine) return;
          var cur = lb.entries[e.nick];
          if (!cur || (e.pts | 0) >= (cur.pts | 0)) { lb.entries[e.nick] = e; changed = true; }
        });
        if (changed) lbPublish(true);
        if (lb.open) lbRender();
      }
    });
  }
  function lbRows() {
    var mine = lbMine(), arr = lbSorted(), found = false, h = '';
    arr.forEach(function (e, i) {
      var isMe = e.nick === mine.nick;
      if (isMe) found = true;
      h += '<tr' + (isMe ? ' style="background:rgba(255,198,92,.14)"' : '') + '>' +
        '<td>' + (i + 1) + (i === 0 ? ' 🥇' : i === 1 ? ' 🥈' : i === 2 ? ' 🥉' : '') + '</td>' +
        '<td class="k" style="text-align:left">' + e.nick + (isMe ? '（你）' : '') + '</td>' +
        '<td class="m">' + (e.w || 0) + '</td><td>' + (e.l || 0) + '</td>' +
        '<td>' + (e.ko ? e.ko + ' 手' : '—') + '</td><td>' + (e.bl || 0) + '</td>' +
        '<td class="s">' + (e.pts || 0) + '</td></tr>';
    });
    if (!found) {
      h += '<tr style="background:rgba(255,198,92,.14)"><td>—</td>' +
        '<td class="k" style="text-align:left">' + mine.nick + '（你）</td>' +
        '<td class="m">' + mine.w + '</td><td>' + mine.l + '</td>' +
        '<td>' + (mine.ko ? mine.ko + ' 手' : '—') + '</td><td>' + mine.bl + '</td>' +
        '<td class="s">' + mine.pts + '</td></tr>';
    }
    return h;
  }
  function lbRender(msg) {
    var mine = lbMine();
    var body = '<table class="st"><tr><th>名次</th><th>昵称</th><th>胜</th><th>负</th><th>最快取胜</th><th>失误</th><th>积分</th></tr>' +
      lbRows() + '</table>';
    $('panel').innerHTML = '<h2>排行榜 🏆</h2>' +
      '<div class="sub">全网泥巴菜鸡总榜（房间 ' + LB_ROOM + '）</div>' +
      (msg ? '<div class="tip">' + msg + '</div>' : '') +
      sec('共享榜', body +
        '<div class="tip" style="text-align:left">积分 = 胜×10 + 最快取胜奖励 − 失误×1.5 + 平×2。<br>' +
        (lb.ready ? '已连上榜单通道，成绩会自动上报（同昵称取较高分）。'
          : '正在连接榜单通道…本机成绩先在下面，连上就自动上报。') + '</div>') +
      sec('我的本机战绩',
        '<table class="st">' +
        row3('和糖包下', '你赢 ' + (record.chick || 0), '糖包赢 ' + (record.sugar || 0)) +
        row3('联机对战', '你赢 ' + (record.onlineW || 0), '你输 ' + (record.onlineL || 0)) +
        row3('平局', record.draw || 0, '总局数 ' + (record.games || 0)) +
        row3('最快取胜', (record.fastWin ? record.fastWin + ' 手' : '—'), '生涯失误 ' + (record.blunders || 0)) +
        '</table>') +
      '<div class="row">' +
      '<button id="lbUp">上报我的成绩</button>' +
      '<button id="lbBack" class="ghost">返回</button></div>' +
      '<div class="tip">榜单挂在公共通道上，成绩是各人手机自己上报的，只为图个乐（也可能被人乱报）。</div>';
    $('lbUp').onclick = function () { lbPublish(true); lbRender('已上报：' + mine.nick + '（积分 ' + mine.pts + '）'); };
    $('lbBack').onclick = function () { lb.open = false; showStart(); };
  }
  function showLeaderboard() {
    lb.open = true;
    lbRender();
    lbConnect();
  }
  /* 一局结束后：更新最快取胜记录，并（若榜单已连接）上报 */
  function lbAfterGame(winner, plies) {
    if (winner === humanP && (!record.fastWin || plies < record.fastWin)) record.fastWin = plies;
    saveRecord();
    if (lb.ready) lbPublish(true);
  }

  /* ---------- 绑定 ---------- */
  $('btnUndo').onclick = undo;
  $('btnNew').onclick = function () {
    if (thinking) return;
    if (!online.on) newGame(aiP === 1);
    else if (online.seat === 0 || over) return;

  $('chatSend').onclick = onlineChat;

  $('btnSound').onclick = function () {
    sndOn = !sndOn;

    if (sndOn) sfx.sugar();

  window.addEventListener('resize', layout);

  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  resetStats();
  layout();
  showRecord();
  /* 从 QQ 群点链接进来：?r=房间号 自动入房（&h=1 表示自己是房主） */
  (function autoJoin() {
    try {
      var sp = new URLSearchParams(location.search);
      var r = (sp.get('r') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (r.length >= 4) {
        showStart();                       // 先把开始面板渲染出来，onlineBox 才存在
        showOnlinePanel();
        $('oStat').textContent = '正在进入房间 ' + r + '…';
        onlineEnter(r, sp.get('h') === '1');
      }
    } catch (e) { }
  })();
  updateCtrl();
  requestAnimationFrame(loop);
  setTimeout(function () { layout(); }, 120);
  showStart();
})();
</script>
</body>
</html>
