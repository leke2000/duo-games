<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1a0e">
<meta name="description" content="泥巴菜鸡（宁波财经谐音）战糖包 · 手机五子棋，糖包超算零败，赛后出成绩单">
<title>泥巴菜鸡（宁波财经）战糖包 · 五子棋</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#180f07;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;color:#f3e3cb}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;gap:5px;
    padding:calc(7px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
    background:
      radial-gradient(85% 55% at 50% -8%,rgba(146,104,60,.95) 0%,rgba(146,104,60,0) 62%),
      radial-gradient(120% 80% at 50% 112%,rgba(24,14,5,.95) 0%,rgba(24,14,5,0) 58%),
      linear-gradient(180deg,#5c3f26 0%,#33200f 55%,#1a1007 100%)}
  #hd{position:relative;text-align:center}
  #hd h1{margin:0;font-size:min(6.4vw,24px);letter-spacing:1px;color:#ffdfae;
    text-shadow:0 2px 0 #3a2210,0 0 14px rgba(255,186,88,.32)}
  #hd h1 .vs{color:#ffb347;font-size:.72em;margin:0 5px}
  #pun{font-size:9.5px;color:#c79a63;letter-spacing:.6px;margin-top:1px;opacity:.9}
  #pun b{color:#ffcb76}
  #record{font-size:11px;color:#c9ab84;margin-top:2px;letter-spacing:.3px}
  #record b{color:#ffd07a}
  #cards{display:flex;gap:8px}
  .card{flex:1;display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:15px;min-width:0;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.22));
    border:1.5px solid rgba(255,214,160,.13);transition:border-color .25s,box-shadow .25s,background .25s}
  .card.on{border-color:#ffc65c;background:linear-gradient(180deg,rgba(255,198,92,.16),rgba(0,0,0,.24));
    box-shadow:0 0 0 1px rgba(255,198,92,.3),0 0 18px rgba(255,170,60,.25)}
  .card .ava{width:38px;height:38px;flex:0 0 38px;position:relative}
  .card .ava svg{width:100%;height:100%;display:block}
  .card .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
  .card .meta b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tag{font-size:9px;padding:1px 6px;border-radius:8px;align-self:flex-start;
    background:rgba(0,0,0,.32);color:#f0d9b5;letter-spacing:.4px}
  .card .tag.ai{background:rgba(255,190,80,.22);color:#ffd88f}
  /* ---- 头像表情 ---- */
  .ava .rc{position:absolute;right:-3px;top:-5px;font-size:13px;opacity:0;transition:opacity .18s;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));pointer-events:none}
  .ava.r-sweat .rc-sweat,.ava.r-happy .rc-happy,.ava.r-panic .rc-panic,.ava.r-dead .rc-dead,
  .ava.r-smug .rc-smug,.ava.r-shock .rc-shock,.ava.r-worry .rc-worry{opacity:1}
  .ava.r-panic{animation:shiver .34s infinite}
  @keyframes shiver{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px) rotate(-2deg)}75%{transform:translate(1.5px,-1px) rotate(2deg)}}
  .ava.r-happy{animation:hop .52s 2}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px) scale(1.07)}}
  .ava.r-smug{animation:sway 1.3s infinite}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .ava.r-worry{animation:shiver .6s 2}
  .ava.r-dead{transform:rotate(84deg) scale(.88);filter:grayscale(.65) brightness(.85);transition:.5s}
  #bubble{display:flex;gap:6px;padding:6px 10px;border-radius:12px;min-height:34px;align-items:center;
    background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.06);font-size:12.5px;line-height:1.32;color:#eeddc2}
  #bubble b{flex:none;color:#ffcf7a}
  #bubble.sugar b{color:#ffe3a8}
  #bubble.mud b{color:#e8b884}
  /* ---- 泥巴度 / 糖分 ---- */
  #meters{display:flex;align-items:center;gap:6px;font-size:10px;color:#bda078;letter-spacing:.3px}
  .meter{flex:1;height:8px;border-radius:5px;overflow:hidden;background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.07)}
  .meter i{display:block;height:100%;width:50%;transition:width .5s cubic-bezier(.3,.9,.3,1)}
  #meterMud i{background:linear-gradient(90deg,#7b5024,#c08a4e)}
  #meterSugar i{background:linear-gradient(90deg,#e7c68e,#fffaf0)}
  #cast{font-size:10.5px;color:#a9927a;line-height:1.35;min-height:14px;padding:0 2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cast b{color:#ffcb76;font-weight:600}
  #boardWrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
  #board{touch-action:none;display:block;border-radius:16px;
    box-shadow:0 12px 28px rgba(0,0,0,.55),0 0 0 3px rgba(255,214,160,.16)}
  #think{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);display:flex;gap:6px;
    align-items:center;padding:5px 13px;border-radius:999px;font-size:11.5px;color:#ffd493;
    background:rgba(20,12,5,.85);border:1px solid rgba(255,205,120,.32);white-space:nowrap}
  #think.hide{display:none}
  #think i{width:10px;height:10px;border-radius:50%;border:2px solid #ffcf7a;border-top-color:transparent;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #ctrl{display:flex;gap:8px}
  #ctrl button{flex:1;padding:10px 4px;border-radius:14px;font-size:13.5px;font-weight:700;font-family:inherit;
    color:#ffeacb;background:linear-gradient(180deg,#7c5230,#472c16);
    border:1.5px solid rgba(255,206,140,.32);box-shadow:0 3px 0 #24160a,0 6px 14px rgba(0,0,0,.3)}
  #ctrl button:active{transform:translateY(2px);box-shadow:0 1px 0 #24160a}
  #ctrl button:disabled{opacity:.42;filter:grayscale(.6)}
  #ctrl button em{font-style:normal;color:#ffd166}
  #ctrl #btnSound{flex:0 0 44px;font-size:16px}
  /* ---- 弹层 ---- */
  #ovl{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;
    background:radial-gradient(65% 55% at 50% 42%,rgba(74,48,22,.9),rgba(10,6,2,.95))}
  #ovl.hide{display:none}
  #panel{width:min(93vw,404px);max-height:90vh;overflow:auto;text-align:center;border-radius:20px;padding:16px 15px 18px;
    background:linear-gradient(180deg,#4d3219,#28180b);border:2px solid rgba(255,199,120,.38);
    box-shadow:0 22px 50px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.35)}
  #panel h2{margin:0 0 3px;font-size:20px;color:#ffd79a;letter-spacing:1px;text-shadow:0 2px 0 #2a1708}
  #panel .sub{font-size:12px;color:#c8ab86}
  #panel p{font-size:12.5px;line-height:1.7;color:#d8c2a2;margin:8px 0}
  #panel .big{font-size:14px;color:#fff0d5;font-weight:700}
  #panel .hi{color:#ffcf7a;font-weight:700}
  .row{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}
  .row button{padding:12px;border-radius:14px;font-size:14.5px;font-weight:800;font-family:inherit;letter-spacing:.5px;
    color:#3a2208;background:linear-gradient(180deg,#ffd79a,#efb057);border:none;box-shadow:0 3px 0 #a9702c}
  .row button.ghost{background:linear-gradient(180deg,#6b4526,#3a2513);color:#ffe6c4;
    border:1.5px solid rgba(255,205,140,.28);box-shadow:0 3px 0 #21140a;font-weight:600;font-size:13.5px}
  .row button:active{transform:translateY(2px)}
  .tip{font-size:11px;color:#a98f70;margin-top:9px;line-height:1.6}
  /* ---- 战术统计 ---- */
  .warbox{margin:10px 0 4px;padding:9px 11px;border-radius:13px;text-align:left;font-size:12px;line-height:1.68;
    background:rgba(0,0,0,.28);border:1px dashed rgba(255,205,140,.3);color:#e7d3b3}
  .warbox b{color:#ffcf7a}
  .sec{margin-top:12px;text-align:left}
  .sec h3{margin:0 0 6px;font-size:12.5px;color:#ffca7d;letter-spacing:.6px;
    border-left:3px solid #ffb347;padding-left:7px}
  table.st{width:100%;border-collapse:collapse;font-size:11.5px;color:#e2cdaa}
  table.st th,table.st td{padding:4px 5px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
  table.st th{color:#bda078;font-weight:600;font-size:10.5px}
  table.st td.k{text-align:left;color:#b9a186}
  table.st td.m{color:#e8b884;font-weight:700}
  table.st td.s{color:#ffe3a8;font-weight:700}
  ul.mist{margin:4px 0 0;padding-left:16px;font-size:11.5px;line-height:1.75;color:#dcc5a4}
  ul.mist li b{color:#ff9f7a}
  ul.mist li i{font-style:normal;color:#9fdcb0}
  .grade{display:inline-block;padding:2px 9px;border-radius:9px;font-weight:800;font-size:12px;
    background:rgba(0,0,0,.32);margin-left:4px}
  @media (orientation:landscape) and (max-height:620px){
    #app{display:grid;grid-template-columns:min(46vw,330px) 1fr;grid-template-rows:auto auto auto auto auto 1fr;
      grid-template-areas:"hd board" "cards board" "bubble board" "meters board" "cast board" "ctrl board";gap:5px 10px}
    #hd{grid-area:hd}#cards{grid-area:cards}#bubble{grid-area:bubble}#meters{grid-area:meters}
    #cast{grid-area:cast}#boardWrap{grid-area:board}#ctrl{grid-area:ctrl}
    #hd h1{font-size:min(4.4vw,22px)}
  }
</style>
</head>
<body>
<div id="app">
  <header id="hd">
    <h1>泥巴菜鸡<span class="vs">⚔</span>糖包</h1>
    <div id="pun">泥巴菜鸡 ＝ 宁 波 财 经（谐音梗 · 懂的都懂）</div>
    <div id="record">糖包 <b>0</b> 胜 · 菜鸡 <b>0</b> 胜</div>
  </header>
  <div id="cards">
    <div class="card" id="cardMud">
      <div class="ava" id="avaMud">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <ellipse cx="32" cy="42" rx="19" ry="17" fill="#ffd24a"/>
          <circle cx="32" cy="26" r="14" fill="#ffdd66"/>
          <path d="M20 44c6 5 18 5 24 0v8c-6 5-18 5-24 0z" fill="#e8b93a" opacity=".65"/>
          <ellipse cx="30" cy="45" rx="12" ry="8" fill="#7b5230" opacity=".92"/>
          <ellipse cx="43" cy="48" rx="7" ry="5" fill="#6b4526" opacity=".85"/>
          <circle cx="26" cy="24" r="2.6" fill="#2c1d0a"/><circle cx="38" cy="24" r="2.6" fill="#2c1d0a"/>
          <circle cx="26.9" cy="23.1" r=".9" fill="#fff"/><circle cx="38.9" cy="23.1" r=".9" fill="#fff"/>
          <path d="M32 28l4 3-4 3-4-3z" fill="#ff9d21"/>
          <path d="M14 18c3 0 5 2 5 5" stroke="#8a5a2c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <circle cx="49" cy="15" r="4.4" fill="#7b5230" opacity=".8"/>
        </svg>
        <span class="rc rc-sweat">💦</span><span class="rc rc-happy">🎉</span>
        <span class="rc rc-panic">😱</span><span class="rc rc-dead">💀</span>
      </div>
      <div class="meta"><b>泥巴菜鸡</b><span class="tag">你 · 宁波财经</span></div>

    <div class="card" id="cardSugar">
      <div class="ava" id="avaSugar">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M22 11c2-3 5-3 7 0" stroke="#fff3dc" stroke-width="2" fill="none" opacity=".55" stroke-linecap="round"/>
          <path d="M35 8c2-3 5-3 7 0" stroke="#fff3dc" stroke-width="2" fill="none" opacity=".45" stroke-linecap="round"/>
          <ellipse cx="32" cy="39" rx="22" ry="19" fill="#fffaf0"/>
          <path d="M32 20c-9 3-16 10-18 19M32 20c9 3 16 10 18 19M32 20v38M32 20c-5 6-8 13-9 20M32 20c5 6 8 13 9 20"
            stroke="#e3d3ba" stroke-width="1.6" fill="none" opacity=".9"/>
          <circle cx="32" cy="27" r="7" fill="#c8863c"/>
          <circle cx="29.6" cy="24.6" r="2.2" fill="#f0c48a" opacity=".8"/>
          <path d="M23 40l5 2M41 40l-5 2" stroke="#3a2a12" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="26" cy="37" r="2" fill="#2c1d0a"/><circle cx="38" cy="37" r="2" fill="#2c1d0a"/>
        </svg>
        <span class="rc rc-smug">😎</span><span class="rc rc-shock">❓</span>
        <span class="rc rc-happy">👑</span><span class="rc rc-worry">🥵</span>
      </div>
      <div class="meta"><b>糖包</b><span class="tag ai">食堂二楼 · 超算</span></div>
    </div>
  </div>
  <div id="bubble"><b id="bubbleWho">糖包</b><span id="bubbleTxt">来啊，菜鸡。</span></div>
  <div id="meters">
    <span>泥巴度</span><div class="meter" id="meterMud"><i></i></div>
    <span id="meterTxt">50 : 50</span><div class="meter" id="meterSugar"><i></i></div>
    <span>糖分</span>
  </div>
  <div id="cast"><b>解说：</b>开局，糖包先手。</div>
  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="think" class="hide"><i></i><span id="thinkTxt">糖包在算…</span></div>
  </div>
  <div id="ctrl">
    <button id="btnUndo">悔棋 <em id="undoLeft">2</em></button>
    <button id="btnNew">重开</button>

    <button id="btnSound" title="音效">🔊</button>
  </div>
  <div id="ovl"><div id="panel"></div></div>
</div>

<script id="engine">
/* ==========================================================================
   五子棋引擎 —— 泥巴菜鸡战糖包
   纯逻辑，零 DOM 依赖（可单独放进 node 里自测 / 对练）

   思路：
   1) 局面评估：对每个空点，用 9 格窗口的棋型表（3^8 = 6561 项）算出
      "这一手下在这里能形成什么棋型"（成五 / 活四 / 冲四 / 活三 / 眠三 / 活二…），
      四个方向累加。整盘分值 = 所有空点分值之和；落子、撤子只增量更新受影响的点。
   2) 搜索：迭代加深 α-β + 置换表 + killer + 着法排序。
      关键增强是"强制着法"：对手有成五点时必须只搜挡点；自己有成五点直接判胜。
      强制着法会把分支压到 1~2，于是连续冲四（VCF）那类深算几乎不花代价。
   3) 开局：空盘走天元；后手第一手贴对角。其余全靠搜索。
   ========================================================================== */
(function (global) {
  'use strict';

  var N = 15, SZ = N * N;
  var EMPTY = 0, BLACK = 1, WHITE = 2;
  var INF = 1e9, WINSCORE = 5e8;

  /* ---------- 棋型分值 ---------- */
  var S = {
    FIVE: 10000000,   // 成五
    OPEN_FOUR: 300000, // 活四（两头都能成五，基本等于赢）
    FOUR: 50000,      // 冲四（对手必须挡）
    OPEN_THREE: 20000, // 活三（对手必须应）
    THREE: 2000,      // 眠三
    OPEN_TWO: 500,    // 活二
    TWO: 100,
    ONE: 20
  };

  /* ---------- 方向：横 / 竖 / 撇 / 捺 ---------- */
  var DR = [0, 1, 1, 1], DC = [1, 0, 1, -1];

  /* ---------- 棋型模板（窗口内中心的 1 是刚下的那手） ---------- */
  var P_OPEN4 = ['011110'];
  var P_FOUR = ['11110', '01111', '11011', '10111', '11101'];
  var P_OPEN3 = ['001110', '011100', '010110', '011010'];
  var P_THREE = ['01110', '11100', '00111', '11010', '10110', '01101', '10101', '11001', '10011', '01011'];
  var P_OPEN2 = ['001100', '011000', '000110', '010100', '001010', '101000', '000101'];
  var P_TWO = ['0110', '1100', '0011', '1010', '0101', '1001'];

  function shapeScore(s) {
    var i;
    for (i = 0; i <= 4; i++) {
      if (s.charCodeAt(i) === 49 && s.charCodeAt(i + 1) === 49 && s.charCodeAt(i + 2) === 49 &&
          s.charCodeAt(i + 3) === 49 && s.charCodeAt(i + 4) === 49) return S.FIVE;
    }
    function hit(len, pats) {
      var lo = Math.max(0, 4 - len + 1), hi = Math.min(4, 9 - len);
      for (var k = lo; k <= hi; k++) if (pats.indexOf(s.substr(k, len)) >= 0) return true;
      return false;
    }
    if (hit(6, P_OPEN4)) return S.OPEN_FOUR;
    if (hit(5, P_FOUR)) return S.FOUR;
    if (hit(6, P_OPEN3)) return S.OPEN_THREE;
    if (hit(5, P_THREE)) return S.THREE;
    if (hit(6, P_OPEN2)) return S.OPEN_TWO;
    if (hit(4, P_TWO)) return S.TWO;
    return S.ONE;
  }

  /* 方向窗口查表：三进制编码 8 个邻格（0 空 / 1 己方 / 2 对方或墙） */
  var DIRTABLE = new Int32Array(6561);
  (function buildTable() {
    var d = new Array(8);
    for (var code = 0; code < 6561; code++) {
      var c = code;
      for (var i = 7; i >= 0; i--) { d[i] = c % 3; c = (c - d[i]) / 3; }
      DIRTABLE[code] = shapeScore('' + d[0] + d[1] + d[2] + d[3] + '1' + d[4] + d[5] + d[6] + d[7]);
    }
  })();

  /* ---------- 局面数据 ---------- */
  var board = new Int8Array(SZ);
  var dirSc = new Int32Array(SZ * 8);   // [(cell*4+d)*2 + (p-1)]
  var pSc = new Int32Array(SZ * 2);     // [cell*2 + (p-1)]
  var total = new Float64Array(3);      // total[p] = 全盘 p 的潜在分值之和
  var nc = new Int16Array(SZ);          // 附近 2 格内的落子数
  var inCand = new Uint8Array(SZ);
  var listPos = new Int16Array(SZ);
  var candList = [];
  var zob = new Int32Array(SZ * 2);
  var hash = 0, stones = 0;

  (function initZob() {
    var s = 20250923 | 0;
    function rnd() { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return s | 0; }
    for (var i = 0; i < SZ * 2; i++) zob[i] = rnd();
  })();

  var TIME_TIMEOUT = { timeout: true };

  function inB(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }

  /* ---------- 候选点管理 ---------- */
  function addCand(cell) {
    if (board[cell] === EMPTY && !inCand[cell]) {
      inCand[cell] = 1; listPos[cell] = candList.length; candList.push(cell);
    }
  }
  function delCand(cell) {
    if (inCand[cell]) {
      inCand[cell] = 0;
      var p = listPos[cell], last = candList.pop();
      if (p < candList.length) { candList[p] = last; listPos[last] = p; }
    }
  }
  function neighborBump(idx, delta) {
    var r0 = (idx / N) | 0, c0 = idx % N;
    var r1 = Math.max(0, r0 - 2), r2 = Math.min(N - 1, r0 + 2);
    var c1 = Math.max(0, c0 - 2), c2 = Math.min(N - 1, c0 + 2);
    for (var r = r1; r <= r2; r++) {
      for (var c = c1; c <= c2; c++) {
        if (r === r0 && c === c0) continue;
        var cell = r * N + c;
        nc[cell] += delta;
        if (delta > 0) { if (nc[cell] === 1) addCand(cell); }
        else if (nc[cell] <= 0) { nc[cell] = 0; delCand(cell); }
      }
    }
  }

  /* ---------- 分值增量维护 ---------- */
  function computeDirScore(cell, d, p) {
    var r0 = (cell / N) | 0, c0 = cell % N, dr = DR[d], dc = DC[d];
    var code = 0, r, c, b, v, step;
    for (step = -4; step <= 4; step++) {
      if (step === 0) continue;
      r = r0 + step * dr; c = c0 + step * dc; v = 2;
      if (r >= 0 && r < N && c >= 0 && c < N) {
        b = board[r * N + c];
        if (b === EMPTY) v = 0; else if (b === p) v = 1; else v = 2;
      }
      code = code * 3 + v;
    }
    return DIRTABLE[code];
  }

  function updateScores(idx) {
    var r0 = (idx / N) | 0, c0 = idx % N, d, step, p, r, c, cell, b, nv, old, delta;
    for (d = 0; d < 4; d++) {
      var dr = DR[d], dc = DC[d];
      for (step = -4; step <= 4; step++) {
        r = r0 + step * dr; c = c0 + step * dc;
        if (r < 0 || r >= N || c < 0 || c >= N) continue;

        for (p = 1; p <= 2; p++) {

          old = dirSc[b + p - 1];

  /* ---------- 落子 / 撤子（搜索内部用） ---------- */
  function put(idx, p) {

    var b = idx * 8;

    total[2] -= pSc[idx * 2 + 1]; pSc[idx * 2 + 1] = 0;

      s2 = pSc[cell * 2 + opp - 1];
      if (s1 >= S.FIVE) return cell;                       // 自己能成五

    for (i = 0; i < n; i++) {

      finally { cut(cell); }

  function newGame() {

  function play(idx, p) {

  }

  function winLine(idx, p) {

    var r0 = (idx / N) | 0, c0 = idx % N, d;
    for (d = 0; d < 4; d++) {

      while (inB(r0 + (hi + 1) * dr, c0 + (hi + 1) * dc) && board[(r0 + (hi + 1) * dr) * N + (c0 + (hi + 1) * dc)] === p) hi++;

  function snapshot() {

  }
  function restore(sn) {
    board.set(sn.b); dirSc.set(sn.d); pSc.set(sn.p); total.set(sn.t);

    $('meterMud').firstChild.style.width = pct.toFixed(0) + '%';
    $('meterSugar').firstChild.style.width = (100 - pct).toFixed(0) + '%';
    var st = pct < 12 ? ' · 挂科预警' : pct < 28 ? ' · 绩点告急' : pct < 45 ? ' · 有点吃力' : pct > 62 ? ' · 泥巴有戏' : '';
    $('meterTxt').textContent = Math.round(pct) + ' : ' + Math.round(100 - pct) + st;
  }
  function gradeOf(m) {
    var b = m.blunder, made = m.four + m.openFour + m.three + m.five;
    if (b === 0 && made >= 3) return { g: 'S', gpa: '4.0', t: '宁财泥巴学神（一堂课没翘，一手没错）', c: '#ffd166' };
    if (b <= 1 && made >= 2) return { g: 'A', gpa: '3.7', t: '泥巴学霸（手上真有点活）', c: '#c8e08a' };
    if (b <= 2) return { g: 'B', gpa: '3.0', t: '老学长（及格线以上，混得还行）', c: '#9fd6e8' };
    if (b <= 4) return { g: 'C', gpa: '2.0', t: '摸鱼人（绩点已进入危险区）', c: '#e8c39f' };
    return { g: 'D', gpa: '1.0', t: '挂科预警（糖包已把成绩单发到辅导员）', c: '#e89f9f' };
  }
  /* 教务处点评 */
  function campusRemark(m, winner) {
    if (winner === 1 && m.blunder === 0) return '本场无违规，可申请「五子棋专项」奖学金';
    if (m.blunder === 0) return '本场没有大漏着，可以申请奖学金（五子棋专项）';
    if (m.blunder <= 2) return '表现尚可，建议多去图书馆占座';
    if (m.blunder <= 4) return '基础不牢，建议重修《五子棋导论》';
    return '已登记挂科，请于下周一携带学生卡到教务处报到';
  }
  function sec(title, body) { return '<div class="sec"><h3>' + title + '</h3>' + body + '</div>'; }
  function row3(k, a, b) { return '<tr><td class="k">' + k + '</td><td class="m">' + a + '</td><td class="s">' + b + '</td></tr>'; }
  function buildReport(winner) {
    var m = stats.mud, sg = stats.sugar, h = '';
    var who = winner === aiP ? '糖包' : winner === humanP ? '泥巴菜鸡' : '';
    var how = winner === aiP ? 'KO' : winner === humanP ? '被菜鸡翻盘' : '平局';
    var mudAvg = m.moves ? m.ms / m.moves : 0, sugAvg = sg.moves ? sg.ms / sg.moves : 0;
    h += '<div class="warbox">' +
      '<b>战报：</b>' + (winner ? who + ' 用 ' + hist.length + ' 手 ' + how + '。' : '本局 ' + hist.length + ' 手，未分胜负。') +
      '<br><b>糖包算力：</b>搜索 ' + (sg.nodes / 1000).toFixed(1) + ' 千个局面，最深 ' + sg.maxDepth + ' 层，共想 ' +
      (sg.ms / 1000).toFixed(1) + ' 秒' +
      (sg.verdictPly ? '，<b>第 ' + sg.verdictPly + ' 手就判定必胜</b>（' + nm(sg.verdictCell) + '）' : '') + '。' +
      '<br><b>手速对比：</b>你平均每手 ' + (mudAvg / 1000).toFixed(1) + ' 秒，糖包平均 ' + (sugAvg / 1000).toFixed(2) + ' 秒' +
      (mudAvg && sugAvg ? '（它比你快 <b>' + Math.max(1, Math.round(mudAvg / Math.max(1, sugAvg))) + '</b> 倍）' : '') + '。<br>' +
      '<b>糖包档案：</b>食堂二楼糖包一只，被教务处塞了超算芯片，专治宁财菜鸡，至今零败。' +
      '</div>';
    var gr = gradeOf(m);
    h += sec('泥巴成绩单（宁财版）',
      '<div class="big">本局绩点 <span class="grade" style="color:' + gr.c + '">' + gr.gpa + '</span>（' + gr.g + ' 级）· ' + gr.t + '</div>' +
      '<div class="tip" style="text-align:left;margin-top:5px">漏胜（送分题 ' + m.missWin + ' 道） · ' +
      '漏挡/大漏着（挂科 ' + m.blunder + ' 门） · 正着（满分 ' + m.best + ' 手） · ' +
      '生涯累计失误 ' + record.blunders + ' 次（共 ' + record.games + ' 局）<br>' +
      '教务处点评：' + campusRemark(m, winner) + '。</div>');
    h += sec('战术统计', '<table class="st">' +
      '<tr><th></th><th>泥巴菜鸡</th><th>糖包</th></tr>' +
      row3('落子手数', m.moves, sg.moves) +
      row3('活三', m.three, sg.three) +
      row3('冲四 / 挡冲四', m.four + ' / ' + m.blockFour, sg.four + ' / ' + sg.blockFour) +
      row3('活四 / 成五', m.openFour + ' / ' + m.five, sg.openFour + ' / ' + sg.five) +
      row3('挡活三', m.blockThree, sg.blockThree) +
      row3('闲手', m.quiet, sg.quiet) +
      row3('挂科 / 满分', m.blunder + ' / ' + m.best, '0 / —') +
      row3('最高评分', m.topCell >= 0 ? nm(m.topCell) + ' (' + Math.round(m.topScore) + ')' : '—',
        sg.topCell >= 0 ? nm(sg.topCell) + ' (' + Math.round(sg.topScore) + ')' : '—') +
      '</table>');
    if (stats.mistakes.length) {
      var li = '';
      stats.mistakes.slice(0, 5).forEach(function (k) {
        li += '<li>第 <b>' + k.ply + '</b> 手 <b>' + nm(k.cell) + '</b> —— ' + k.tag +
          (k.suggest >= 0 && k.suggest !== k.cell ? '，其实该下 <i>' + nm(k.suggest) + '</i>' : '') + '</li>';
      });
      h += sec('补考清单（前 5 门，错的都是送分题）', '<ul class="mist">' + li + '</ul>');
    } else {
      h += sec('补考清单', '<div class="tip" style="text-align:left">零挂科！糖包表示有点意外，教务处也有点意外。</div>');
    }
    if (sg.verdictPly) {
      h += sec('糖包的高光时刻（教务系统：糖包 100 分）',
        '<div class="tip" style="text-align:left">第 <b style="color:#ffcf7a">' + sg.verdictPly + '</b> 手落在 <b style="color:#ffcf7a">' +
        nm(sg.verdictCell) + '</b> 之后，它已经算出必胜路线 —— 那时候它就知道你输了。</div>');
    }
    if (m.topCell >= 0) {
      h += sec('你的满分那一手（本局唯一亮点）', '<div class="tip" style="text-align:left">第 <b style="color:#ffcf7a">' + m.topPly +
        '</b> 手 <b style="color:#ffcf7a">' + nm(m.topCell) + '</b>（评分 ' + Math.round(m.topScore) +
        '）—— 宁财泥巴也有闪光时刻。</div>');
    }
    return h;
  }

  /* ---------- 交互 ---------- */
  function hit(ev) {
    var rect = cv.getBoundingClientRect();
    var x = (ev.clientX - rect.left) * (CSSSZ / rect.width);
    var y = (ev.clientY - rect.top) * (CSSSZ / rect.height);
    var c = Math.round((x - PAD) / CELL), r = Math.round((y - PAD) / CELL);
    if (r < 0 || r >= N || c < 0 || c >= N) return -1;
    if (Math.hypot(x - (PAD + c * CELL), y - (PAD + r * CELL)) > CELL * .62) return -1;
    return r * N + c;
  }
  cv.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    if (over || thinking || turnP() !== humanP) return;
    var cell = hit(ev);
    if (cell < 0 || G.board()[cell] !== 0) return;
    humanMove(cell);
  }, { passive: false });
  cv.addEventListener('pointermove', function (ev) {
    if (ev.pointerType === 'touch') return;
    var cell = hit(ev);
    if (cell !== hoverCell) { hoverCell = cell; dirty = true; }
  });
  cv.addEventListener('pointerleave', function () { hoverCell = -1; dirty = true; });

  /* ---------- 对局流程 ---------- */
  function turnP() { return hist.length % 2 === 0 ? 1 : 2; }
  function newGame(aiFirst) {
    G.newGame();
    hist = []; snaps = [G.snapshot()];
    undoLeft = 2; over = false; thinking = false; lastMove = -1; winCells = null;
    popAt = {}; particles = []; hoverCell = -1;
    resetStats();
    humanP = aiFirst ? 2 : 1; aiP = 3 - humanP;
    $('avaMud').className = 'ava'; $('avaSugar').className = 'ava';
    $('ovl').classList.add('hide');
    $('think').classList.add('hide');
    showRecord(); updateCtrl();
    turnStart = gameStart = performance.now();
    markTurn(); updateMeters();
    turn();
    say(aiFirst ? 'sugar' : 'mud', aiFirst ? pick(SUGAR_LINES, 's') : pick(MUD_LINES, 'm'));
    castLine(aiFirst ? '糖包天元开局，菜鸡请接招。' : '菜鸡先手，解说：勇气可嘉。');
    render();
  }
  function markTurn() {
    var p = turnP();
    $('cardMud').classList.toggle('on', !over && p === humanP);
    $('cardSugar').classList.toggle('on', !over && p === aiP);
  }
  function updateCtrl() {
    $('undoLeft').textContent = undoLeft;
    $('btnUndo').disabled = over || thinking || undoLeft <= 0;
    $('btnSwap').disabled = thinking;
  }
  function turn() {
    markTurn();
    if (over) return;
    if (turnP() === aiP) aiPlay();
    else { turnStart = performance.now(); say('mud', '该你了，落子吧。'); }
  }
  function commit(cell, p) {
    if (!G.play(cell, p)) return false;
    hist.push({ i: cell, p: p });
    snaps.push(G.snapshot());
    lastMove = cell; popAt[cell] = performance.now();
    spawn(cell, p === aiP ? 'sugar' : 'mud');
    return true;
  }
  function humanMove(cell) {
    var j = judge(cell, humanP);
    stats.mud.ms += performance.now() - turnStart;
    recordMove('mud', cell, j, hist.length + 1);
    if (!commit(cell, humanP)) return;
    sfx.place();
    updateMeters();
    var line = G.winLine(cell, humanP);
    if (line) { endGame(humanP, line); return; }
    if (hist.length >= SZ) { endGame(0, null); return; }
    /* 糖包的反应：菜鸡下手狠了会吓一跳 */
    var r2 = G.report(aiP);
    if (r2.win.length || (j.kind !== 'quiet' && j.kind !== 'blockThree' && j.my >= S.OPEN_THREE)) {
      reaction('sugar', 'shock'); say('sugar', pick(SUGAR_SHOCK, 'sh'));
    } else if (j.played >= j.best - 1 && stats.mud.best % 3 === 0) {
      say('mud', pick(MUD_GOOD, 'good'));
    }
    updateCtrl();
    turn();
  }
  function aiPlay() {
    thinking = true; updateCtrl(); markTurn();
    $('think').classList.remove('hide');
    $('thinkTxt').textContent = '糖包在算…';
    setTimeout(function () {
      var r;
      try { r = G.think(aiP, AI_TIME); }
      catch (e) {
        var cand = G.candidates();
        r = { move: cand.length ? cand[0] : 112, depth: 0, nodes: 0, ms: 0, score: 0 };
      }
      var mv = r.move >= 0 ? r.move : 112;
      var jj = judge(mv, aiP);
      thinking = false;
      $('think').classList.add('hide');
      stats.sugar.nodes += r.nodes || 0;
      stats.sugar.ms += r.ms || 0;
      if (r.depth > stats.sugar.maxDepth) stats.sugar.maxDepth = r.depth;
      var ply = hist.length + 1;
      var firstVerdict = r.win && !stats.sugar.verdictPly;
      if (firstVerdict) { stats.sugar.verdictPly = ply; stats.sugar.verdictCell = mv; }
      recordMove('sugar', mv, jj, ply);
      if (!G.board()[mv]) commit(mv, aiP);
      sfx.sugar();
      updateMeters(); updateCtrl();
      var line = G.winLine(mv, aiP);
      if (line) { endGame(aiP, line); return; }
      if (hist.length >= SZ) { endGame(0, null); return; }
      if (r.win) {
        reaction('sugar', 'happy'); reaction('mud', 'panic'); say('sugar', pick(SUGAR_KILL, 'k'));
        if (firstVerdict) castLine('教务系统已录入：糖包 <b>100</b> 分，泥巴 <b>59</b> 分（差一分及格）。');
      }
      else if (jj.kind === 'four' || jj.kind === 'openFour') { reaction('mud', 'sweat'); say('sugar', pick(SUGAR_FOUR, 'f')); }
      else if (jj.kind === 'blockFour' || jj.kind === 'blockThree') say('sugar', pick(SUGAR_BLOCK, 'bl'));
      else if (G.evalFor(humanP) < -120000) { reaction('sugar', 'smug'); say('sugar', pick(SUGAR_BORED, 'bo')); }
      else say('sugar', pick(SUGAR_LINES, 's'));
      if (G.evalFor(humanP) < -400000) reaction('mud', 'sweat');
      render();
      turn();
    }, 60);
  }
  function undo() {
    if (over || thinking || undoLeft <= 0) return;
    var k = hist.length, removedHuman = false;
    while (k > 0 && hist[k - 1].p === aiP) k--;
    if (k > 0 && hist[k - 1].p === humanP) { k--; removedHuman = true; }
    if (!removedHuman) return;
    hist = hist.slice(0, k);
    snaps = snaps.slice(0, k + 1);
    G.restore(snaps[k]);
    undoLeft--;
    over = false; winCells = null;
    lastMove = k > 0 ? hist[k - 1].i : -1;
    popAt = {}; particles = []; hoverCell = -1;
    if (stats.stains.length) stats.stains.pop();
    sfx.undo();
    updateCtrl(); updateMeters();
    turn();
    say('mud', '这手不算，我重下！');
    castLine('悔棋 ×1 —— 泥巴可以糊第二次。');
    render();
  }
  function endGame(winner, line) {
    over = true; thinking = false; winCells = line; winAt = performance.now();
    $('think').classList.add('hide');
    if (winner === aiP) { record.sugar++; record.blunders += stats.mud.blunder; sfx.lose(); }
    else if (winner === humanP) { record.chick++; sfx.win(); }
    else { record.draw++; sfx.undo(); }
    record.games = (record.games || 0) + 1;
    saveRecord(); showRecord(); updateCtrl(); markTurn();
    if (winner === aiP) { reaction('sugar', 'happy'); reaction('mud', 'dead'); }
    else if (winner === humanP) { reaction('mud', 'happy'); reaction('sugar', 'shock'); say('mud', pick(MUD_WIN, 'w')); }
    render();
    setTimeout(function () { showResult(winner); }, line ? 1600 : 400);
  }
  function showResult(winner) {
    var head = winner === aiP ? '<h2>糖包赢了 🍬</h2><div class="sub">成绩单已出：' + pick(SUGAR_WIN, 'w') + '</div>'
      : winner === humanP ? '<h2>不可能…你赢了？！</h2><div class="sub">糖包：一定是手机卡了。</div>'
        : '<h2>平局</h2><div class="sub">泥巴和糖糊成一团了。</div>';
    $('panel').innerHTML = head +
      '<div class="row">' +
      '<button id="againAi">再来一局（糖包先走）</button>' +
      '<button id="againMe" class="ghost">再来一局（我先走）</button>' +
      '<button id="againSame" class="ghost">先看看这盘棋</button>' +
      '</div>' + buildReport(winner) +
      '<div class="tip">绩点看的是「漏挡 / 漏胜 / 大漏着」；棋盘上的泥渍就是你的挂科痕迹（笑）。<br>' +      '每局 2 次悔棋，只能悔自己的棋。</div>';
    $('ovl').classList.remove('hide');
    $('againAi').onclick = function () { newGame(true); };
    $('againMe').onclick = function () { newGame(false); };
    $('againSame').onclick = function () { $('ovl').classList.add('hide'); };
    $('panel').scrollTop = 0;
  }
  function showStart() {
    $('panel').innerHTML = '<h2>泥巴菜鸡 ⚔ 糖包</h2>' +
      '<div class="sub">15×15 五子连珠 · 宁波财经谐音梗 · 赛后出成绩单</div>' +
      '<p><span class="hi">泥巴菜鸡</span>＝<span class="hi">宁波财经</span>（谐音梗）：在读，也在挨打；' +
      '专业课没学明白，五子棋也没学明白。<br>' +
      '<span class="hi">糖包</span>＝食堂二楼三块五一个的糖包，被教务处偷偷塞了超算芯片，' +
      '现在专治菜鸡：<span class="hi">六层以上算路 + 连续冲四杀棋</span>，建成双活三、四三杀就一口吃掉你。放水？不存在的。</p>' +
      '<p class="big">选谁先走：</p>' +
      '<div class="row">' +
      '<button id="stAi">糖包先走（推荐 · 你更没机会）</button>' +
      '<button id="stMe" class="ghost">我先走（泥巴也要面子）</button>' +
      '</div>' +
      '<p>下完给你出一份 <span class="hi">成绩单</span>：绩点评级、补考清单、漏挡漏胜、活三冲四各几手、' +
      '糖包第几手判定必胜 —— 数据糊脸，别不服。</p>' +
      '<div class="tip">2 次悔棋机会，只能悔自己的棋。<br>想赢糖包？宁财全校都还没人做到（它自己说的）。</div>';
    $('ovl').classList.remove('hide');
    $('stAi').onclick = function () { newGame(true); };
    $('stMe').onclick = function () { newGame(false); };
  }

  /* ---------- 绑定 ---------- */
  $('btnUndo').onclick = undo;
  $('btnNew').onclick = function () { if (!thinking) newGame(aiP === 1); };
  $('btnSwap').onclick = function () { if (!thinking) newGame(aiP !== 1); };
  $('btnSound').onclick = function () {
    sndOn = !sndOn;
    $('btnSound').textContent = sndOn ? '🔊' : '🔇';
    if (sndOn) sfx.sugar();
  };
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 260); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  resetStats();
  layout();
  showRecord();
  updateCtrl();
  requestAnimationFrame(loop);
  setTimeout(function () { layout(); }, 120);
  showStart();
})();
</script>
</body>
</html>
